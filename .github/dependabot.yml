# Dependabot version updates for the polyglot SDK (one ecosystem per language
# subdir; csharp omitted, no top-level manifest). Library semver-major bumps
# are filtered (handled manually); routine minor/patch land grouped weekly.
version: 2
updates:
  - package-ecosystem: "npm"
    # NACH `dev`, NICHT NACH `main` (25.08.2026). Ohne diese Zeile oeffnet
    # Dependabot gegen den Vorgabe-Zweig - der Bump laege dann auf `main`, ohne
    # je auf `dev` gewesen zu sein: nie durch das Tor, nie auf `test`, nie
    # funktional abgenommen. Und das ausgerechnet bei Aenderungen, die niemand
    # von Hand gelesen hat.
    target-branch: "dev"
    directory: "/typescript"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
