# Dependabot version updates for the polyglot SDK (one ecosystem per language
# subdir; csharp omitted, no top-level manifest). Library semver-major bumps
# are filtered (handled manually); routine minor/patch land grouped weekly.
version: 2
updates:
  - package-ecosystem: "npm"
    # Target `dev`, NOT `main`. Without this line Dependabot opens against the
    # default branch, and the bump would land on `main` without ever being on
    # `dev`: never through the gate, never on `test`, never functionally
    # accepted - for exactly the changes nobody has read by hand.
    target-branch: "dev"
    directory: "/typescript"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
