# Pullfrog - reviews pull requests, triages issues, and can repair a red CI run.
# Open source, runs in our own Actions, talks to a model endpoint we control.
#
# WHERE THE CREDENTIALS LIVE
#
#   secret PULLFROG_BASE_URL   the OpenAI-compatible endpoint
#   secret PULLFROG_API_KEY    its key
#   var    PULLFROG_MODEL      model id that endpoint serves
#   var    PULLFROG_CONTEXT    context window, in tokens
#   var    PULLFROG_MAX_OUTPUT max completion tokens
#
# The base URL is a *secret* rather than a variable on purpose: GitHub masks
# secrets in run logs, and Pullfrog prints the endpoint it dialled. A private
# gateway address does not belong in a public log line. The key never goes into
# the URL - that is the one place masking cannot save it.
#
# WHY THE PRE-FLIGHT STEP EXISTS
#
# With CONTEXT or MAX_OUTPUT unset, Pullfrog does not complain: it assumes
# 32 000 output tokens and switches auto-compaction off. Both failures surface
# in the middle of a review, as a truncated comment that looks like an opinion
# rather than a fault. So the run stops before it starts, and says which value
# is missing.
#
# WHY workflow_dispatch IS THE ONLY TRIGGER
#
# Pullfrog's own automations dispatch this workflow; it does not need a `push`
# or `pull_request` trigger of its own. That also settles the public-repository
# question: only someone with write access can start a run, and a fork's pull
# request never receives these secrets.

name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      # How the action proves to Pullfrog which repository and run it is.
      # Without it the run is rejected.
      id-token: write
      contents: read
    steps:
      - name: Model access must be configured
        env:
          BASE: ${{ secrets.PULLFROG_BASE_URL }}
          KEY: ${{ secrets.PULLFROG_API_KEY }}
          MODEL: ${{ vars.PULLFROG_MODEL }}
          CTX: ${{ vars.PULLFROG_CONTEXT }}
          MAXOUT: ${{ vars.PULLFROG_MAX_OUTPUT }}
        run: |
          miss=""
          [ -n "$BASE" ]   || miss="$miss PULLFROG_BASE_URL(secret)"
          [ -n "$KEY" ]    || miss="$miss PULLFROG_API_KEY(secret)"
          [ -n "$MODEL" ]  || miss="$miss PULLFROG_MODEL(var)"
          [ -n "$CTX" ]    || miss="$miss PULLFROG_CONTEXT(var)"
          [ -n "$MAXOUT" ] || miss="$miss PULLFROG_MAX_OUTPUT(var)"
          if [ -n "$miss" ]; then
            echo "::error::Pullfrog is not configured for this repository. Missing:$miss"
            echo "Set them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Configured. Model: $MODEL, context $CTX, max output $MAXOUT."

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
        env:
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.PULLFROG_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.PULLFROG_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: ${{ vars.PULLFROG_MODEL }}
          OPENAI_COMPATIBLE_CONTEXT: ${{ vars.PULLFROG_CONTEXT }}
          OPENAI_COMPATIBLE_MAX_OUTPUT: ${{ vars.PULLFROG_MAX_OUTPUT }}
