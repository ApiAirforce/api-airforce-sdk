# ============================================================================
# THE GATE BETWEEN `dev` AND `test`.
#
# THE CHAIN (anes decision 2026-08-23):
#
#     dev  ->  [this gate]  ->  test  ->  [acceptance]  ->  main = prod
#
#   `dev`   stays open. Every window pushes straight ahead, no PR requirement.
#   `test`  is the FROZEN candidate. Functional acceptance happens here.
#   `main`  is the delivery.
#
# WHY A FROZEN BRANCH AND NOT JUST `dev`: as long as `dev` keeps moving while
# it is being checked, "checked" and "delivered" are never the same tree. You
# end up checking a state nobody ships, and shipping one nobody checked.
# `test` stands still until it is accepted.
#
# WHAT THIS GATE DEMANDS, all three:
#   1. Every REQUIRED check is green on the dev head.
#   2. Every code commit coming along has its automated review.
#   3. No finding of severity `hoch` is unanswered.
#
# THERE IS NO WAY AROUND. No `--force`, no cherry-pick, no exception input.
# `test` is FAST-FORWARDED, never merged - so `main`, `test` and `dev`
# structurally cannot drift apart (same reasoning as in release-to-main.yml,
# anes announcement 2026-08-18).
#
# WHAT HAPPENS WHEN THE GATE HOLDS: this run does NOT go red - a held gate is
# the normal case, not a defect. Instead the reason is recorded in ONE
# self-closing issue. That doubles as the watch over `dev`: whoever leaves a
# red `dev` behind blocks the delivery of EVERYONE - and finds out here.
#
# WHY THE `push` TRIGGER DOES NOT WAIT:
# `workflow_run` and `schedule` ALWAYS read the file from the default branch
# (`main`). As long as this gate is not there, none of them fires - exactly
# the trap review-audit.yml walked into on 08-23. A `push` trigger instead
# takes the file of the PUSHED branch and works immediately. The price: on
# the push the checks are often still running. This workflow does NOT wait
# then - it frees the runner and lets the next push trigger it again
# (reasoning at the place in the code). Once the file sits on `main`,
# `workflow_run` takes over and hits the timing exactly.
# ============================================================================

# NOTE ON THIS PUBLIC REPO: this file is character-identical to the one in
# the other repos except for two lines - one template, many instances, so
# there is only ONE implementation. The two differences are necessary:
# `ubuntu-latest` instead of a self-hosted runner (a self-hosted runner on a
# public repo is attackable through a fork PR), and DURCHSICHT_NOETIG is set
# to `nein`, because there is no review-push.yml here.

name: promote to test

on:
  push:
    branches: [dev]
  workflow_run:
    workflows: ['CI']
    types: [completed]
    # WITHOUT THIS FILTER THE GATE SHOOTS ITSELF DOWN. The CI also runs on
    # `test` and `main`; every one of those runs triggered a `workflow_run`
    # here. The job then bailed immediately ("did not come from dev") - but
    # the cancel rule below fires BEFORE the job logic, so a meaningless run
    # on `main` cancelled the one run that actually had something to check.
    # Measured 2026-08-23 in the frontend: `dev` stood one commit ahead of
    # `test`, everything green and the review done, and the matching gate run
    # was `cancelled` - shot down by two `workflow_run` runs on the OLD state
    # `d163669d`. The branch filter now keeps them from starting at all.
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read
  # WITHOUT THIS LINE THE GATE CHECKS NOTHING. A `permissions:` block sets
  # everything not mentioned to `none`; `/commits/<sha>/check-runs` then
  # answers 403. Measured 2026-08-23: in all five PRIVATE repos the gate
  # reported "checks are still running", although every check had been green
  # for an hour and a half. In the PUBLIC sdk repo it went unnoticed because
  # check runs are readable for anyone there - a difference that hid the
  # cause for a long time.
  checks: read
  # Older workflows report via the status API instead of as a check run.
  # Today nothing here uses it; the line costs nothing and keeps the same
  # silent gap from coming back through the other door.
  statuses: read
  # WITHOUT THIS LINE THIS WORKFLOW BELIEVES THE WRONG THING. A `permissions:`
  # block sets everything unlisted to `none`, so every pull-request call answers
  # 403 -- and `gh_json(...) or []` turns that 403 into "this commit belongs to
  # no pull request", which is indistinguishable from a real empty result.
  # Nothing turns red; the gate just reads a falsehood. Measured in `frontend`:
  # three consecutive gate runs called the same commit unreviewed while its
  # review sat on the pull request, and the gate stayed shut for two days.
  # Same one line as backend#336 and frontend#133. See backend#363.
  pull-requests: read

# One waiting run is enough. The newest dev state is the one that should go
# to `test` - an older waiter would just be ballast on the runner.
concurrency:
  group: promote-to-test
  cancel-in-progress: true

env:
  # The names are the DISPLAYED job names, as they appear as a check run.
  # Deliberately NOT included: `review` - a red review run says nothing about
  # whether a review is attached to the commit. Point 2 checks that directly
  # at the commit.
  PFLICHT: |
    TypeScript
    Java
    Go
    Python
    C#
    PHP
    Dart
    Rust
  TITEL: 'dev kommt nicht nach test'
  # `nein` ONLY for repos without review-push.yml. There, a direct push
  # carries no review the gate could find - it would report every commit as
  # "without review" and never open. The gate then demands the checks, and
  # only those. Whoever wires up the reviewer there switches this to `ja`.
  DURCHSICHT_NOETIG: 'nein'

jobs:
  tor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Check the gate and fast-forward test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys, time

          REPO = os.environ["REPO"]
          TITEL = os.environ["TITEL"]
          EVENT = os.environ.get("EVENT") or ""
          WR_BRANCH = os.environ.get("WR_BRANCH") or ""
          PFLICHT = [z.strip() for z in (os.environ.get("PFLICHT") or "").splitlines()
                     if z.strip()]
          CODE = (".rs", ".ts", ".tsx", ".js", ".mjs", ".py", ".sql", ".toml",
                  ".yml", ".yaml", ".json")
          SEP = "\x1f"

          def git(*a, check=True):
              r = subprocess.run(["git", *a], capture_output=True, text=True)
              if r.returncode != 0:
                  if check:
                      print("git %s: %s" % (" ".join(a), r.stderr.strip()[:200]),
                            file=sys.stderr)
                  return None
              return r.stdout.strip()

          def gh_json(path, *extra, loud=False):
              r = subprocess.run(["gh", "api", path, *extra],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  # `loud` for the queries whose failure would DISTORT the
                  # verdict instead of merely shortening it. A silent None
                  # looked here like "no check found" and so like "still
                  # running" - the run was green and had checked nothing.
                  if loud:
                      print("::error::gh api %s -> %s"
                            % (path, (r.stderr or r.stdout).strip()[:300]))
                  return None
              try:
                  return json.loads(r.stdout)
              except Exception:
                  if loud:
                      print("::error::gh api %s did not return JSON" % path)
                  return None

          def report(reason, lines):
              """One issue instead of a red run - see the header."""
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## %s\n\n%s\n\n%s\n" % (TITEL, reason, "\n".join(lines)))
              print(reason)
              for z in lines:
                  print("  " + z)
              body = ["**%s**" % reason, ""] + lines + [
                  "",
                  "_This issue closes itself as soon as `test` has been fast-forwarded._",
                  "_It is not a defect of this workflow, but the state of `dev`._",
              ]
              old = gh_json("repos/%s/issues?state=open&per_page=100" % REPO) or []
              number = next((i["number"] for i in old
                             if i.get("title") == TITEL and "pull_request" not in i), None)
              if number:
                  subprocess.run(["gh", "issue", "edit", str(number), "-R", REPO,
                                  "--body", "\n".join(body)],
                                 capture_output=True, text=True)
              else:
                  subprocess.run(["gh", "issue", "create", "-R", REPO,
                                  "--title", TITEL, "--body", "\n".join(body)],
                                 capture_output=True, text=True)

          def close_issue(text):
              old = gh_json("repos/%s/issues?state=open&per_page=100" % REPO) or []
              number = next((i["number"] for i in old
                             if i.get("title") == TITEL and "pull_request" not in i), None)
              if number:
                  subprocess.run(["gh", "issue", "close", str(number), "-R", REPO,
                                  "--comment", text], capture_output=True, text=True)

          # `workflow_run` fires for EVERY branch. Only `dev` is meant.
          if EVENT == "workflow_run" and WR_BRANCH != "dev":
              print("workflow_run came from '%s', not dev - nothing to do." % WR_BRANCH)
              sys.exit(0)

          subprocess.run(["git", "fetch", "origin", "--prune"], capture_output=True)
          dev = git("rev-parse", "origin/dev")
          main = git("rev-parse", "origin/main")
          test = git("rev-parse", "--verify", "-q", "origin/test", check=False)

          if not dev or not main:
              print("::error::dev or main cannot be resolved.")
              sys.exit(1)

          # Without `test`, `main` is the basis - the first pass creates the
          # branch.
          #
          # `test` CAN ALSO SIT BEHIND `main`, and then it is not a candidate
          # but a leftover: `main` has moved on without it. Measured 08-23 in
          # the frontend - `test` stood 20 commits BEHIND `main`, because a
          # release delivered `dev` directly. That was possible because `main`
          # still carried the old version of the release workflow, and
          # `workflow_dispatch` ALWAYS reads the file from the default branch,
          # never from the branch you select.
          #
          # The old version here only asked `test != main` and accordingly
          # reported a waiting candidate of "0 commit(s)". That was a lock
          # that would never have opened by itself: there was nothing to
          # accept, and still the gate held because of it.
          # A CANDIDATE THAT CARRIES NOTHING IS NOT A CANDIDATE.
          #
          # `test` can sit ahead of `main` in COMMITS while its diff against
          # `main` is empty: the automatic `main -> dev` sync comes back around
          # and lands on `test` as one merge commit with no file change in it.
          #
          # Measured 28.08.2026 in api-airforce-status and
          # api-airforce-enterprise-all: `test` one commit ahead of `main`,
          # `compare/main...test` reporting 0 files - and the release pull
          # request for it could not be merged at all, because GitHub demands
          # an extra approval for a change attributed to a bot and does not
          # accept one from the person who triggered the run.
          #
          # So the gate held `dev` back waiting for an acceptance that had
          # nothing to accept and no way to complete - and every release
          # leaves one of these behind, so it would recur after each one.
          # Same disease as the `test`-behind-`main` case above, one step
          # over: a commit COUNT is not a measure of CONTENT.
          #
          # `git diff --quiet` exits 0 when the two trees are identical, so
          # `git()` hands back "" there and None when they differ.
          empty = (test is not None and test != main
                   and git("diff", "--quiet", main, test, check=False) is not None)
          candidate = (test is not None and test != main and not empty
                       and git("merge-base", "--is-ancestor", main, test,
                               check=False) is not None)
          stale = test is not None and test != main and not candidate and not empty
          if empty:
              print("test is ahead of main but carries NO change (empty diff) - "
                    "not a candidate, fast-forwarding.")
          if stale:
              print("test sits BEHIND main - `main` is the basis, `test` is pulled along.")
          basis = test if (test is not None and not stale) else main
          creating = test is None

          if dev == basis:
              close_issue("`test` is on the state of `dev` - nothing open.")
              print("test == dev, nothing to do.")
              sys.exit(0)

          if git("merge-base", "--is-ancestor", basis, dev, check=False) is None:
              report(
                  "`dev` cannot fast-forward `test` - the branches have drifted apart.",
                  ["That must not happen in this chain: `main` -> `test` -> `dev` are",
                   "pure fast-forwards. Whoever ends up here has put something on",
                   "`test` or `main` that did not come through `dev`.",
                   "",
                   "Repair: bring the foreign state into `dev` (a merge into `dev`),",
                   "then the gate runs again. **No cherry-pick.**"])
              sys.exit(0)

          # A candidate that has not been delivered yet is NOT overtaken -
          # otherwise you would again be checking a tree that changes under
          # your hands.
          if candidate and EVENT != "workflow_dispatch":
              ahead = git("rev-list", "--count", "%s..%s" % (main, test)) or "?"
              report(
                  "`test` carries a candidate that has not been delivered yet.",
                  ["`test` is %s commit(s) ahead of `main`. As long as something there" % ahead,
                   "waits for acceptance, it is not overtaken - a candidate that changes",
                   "under review is not a candidate.",
                   "",
                   "**Next step: accept and deliver** (`release to main` or",
                   "`promote-to-main`). This gate then pulls the next state along by",
                   "itself. To deliberately discard the candidate and replace it with",
                   "the newest `dev` state: start this workflow by hand."])
              sys.exit(0)

          # ---- Point 1: required checks --------------------------------------
          def state(sha):
              d = gh_json("repos/%s/commits/%s/check-runs?per_page=100" % (REPO, sha),
                          loud=True)
              if d is None:
                  # Do NOT let this pass as "still running": that would be a
                  # verdict about checks that were never even read.
                  report("The gate could NOT READ the checks.",
                         ["The check-run query failed - the error is",
                          "recorded as `::error::` in the run log.",
                          "",
                          "That is a defect of the gate, not a state of `dev`. Most",
                          "likely cause: the token is missing `checks: read` in the",
                          "`permissions:` block.",
                          "",
                          "As long as this stands, NOTHING goes through the gate - it",
                          "holds, instead of waving things through unchecked."])
                  sys.exit(1)
              latest = {}
              for c in d.get("check_runs", []):
                  n = c.get("name") or ""
                  prior = latest.get(n)
                  # On a restart, the newest run of the same name counts.
                  if prior is None or (c.get("started_at") or "") > (prior.get("started_at") or ""):
                      latest[n] = c
              return latest

          # LOOK ONCE, DO NOT WAIT.
          #
          # A 30-minute wait loop used to stand here. It was a defect, and a
          # self-blocking one at that: measured 08-23, EVERY repo has exactly
          # ONE runner of its own (backend 3, frontend 2). As long as this job
          # waits, it HOLDS the only runner - and the checks it is waiting for
          # need exactly that runner. Proven in four repos: CI stood in the
          # queue for over an hour while the gate sat next to it waiting.
          #
          # So: measure once, and if the checks are still running, free the
          # runner immediately. The next `dev` push triggers the gate again
          # anyway, and once this file sits on `main`, `workflow_run` takes
          # over and hits the timing exactly.
          st = state(dev)

          # A CHECK THAT NEVER STARTED IS NOT A CHECK THAT IS STILL RUNNING.
          #
          # `st.get(n, {})` returns an empty dict for a name with no check run
          # at all, and its `status` is None, which is != "completed" - so both
          # states came out of the same sentence. They are not the same thing:
          # one resolves itself in minutes, the other never does.
          #
          # Measured 28.08.2026: after the automatic `main -> dev` sync, FOUR
          # repositories carried a `dev` head with ZERO check runs, because a
          # push made with `GITHUB_TOKEN` triggers no workflow. The gate
          # reported "the checks are still running" for over two hours about
          # checks that were never going to start, and nothing reached `test`
          # in any of them until a person merged something by hand. On the
          # `dev` head before it, pushed by a person, the same checks were
          # green - so it was never a property of the code.
          #
          # Both states still hold the gate; neither is a verdict about `dev`.
          # But they call for different actions, so they no longer share a
          # sentence.
          missing = [n for n in PFLICHT if n not in st]
          if missing:
              report(
                  "A required check NEVER STARTED on the `dev` head.",
                  ["No run at all: " + ", ".join("`%s`" % n for n in missing),
                   "",
                   "This is NOT the same as `still running`, and it does NOT resolve",
                   "itself. Not a single run of these checks exists on this commit,",
                   "so there is nothing to wait for.",
                   "",
                   "Most likely cause: the commit was made by a bot. A push made with",
                   "`GITHUB_TOKEN` triggers NO workflows - so the `main -> dev` sync",
                   "leaves behind a `dev` head that no check ever sees.",
                   "",
                   "Remedy: start the check by hand",
                   "(`gh workflow run <workflow> --ref dev`), or merge a pull request",
                   "into `dev` - either produces a head the CI actually runs on.",
                   "",
                   "Head: `%s`" % dev[:8]])
              sys.exit(0)

          pending = [n for n in PFLICHT
                     if n in st and st[n].get("status") != "completed"]
          if pending:
              report(
                  "The checks on the `dev` head are still running.",
                  ["Not finished yet: " + ", ".join("`%s`" % n for n in pending),
                   "",
                   "This is NOT a finding - just a look taken too early. This run",
                   "frees the runner immediately so the checks can have it.",
                   "",
                   "It continues by itself: the next push to `dev` triggers the gate",
                   "again. Whoever does not want to wait starts *promote to test* by hand.",
                   "",
                   "If this message stands for hours, it is a finding after all -",
                   "then no check is starting, and `dev` carries no meaning.",
                   "",
                   "State: `%s`" % dev[:8]])
              sys.exit(0)

          # `skipped`/`neutral` is not a failure: a job its own `if` skipped
          # has nothing to say - but it must not block anything either.
          red = [n for n in PFLICHT
                 if st.get(n, {}).get("conclusion") not in ("success", "skipped", "neutral")]
          if red:
              lines = ["Red on `%s`:" % dev[:8], ""]
              for n in red:
                  c = st.get(n, {})
                  lines.append("- `%s` -> **%s**  %s"
                               % (n, c.get("conclusion") or "missing",
                                  c.get("html_url") or ""))
              lines += ["",
                        "As long as this stands, NOTHING reaches `test` and so nothing",
                        "reaches customers - including the work of the other windows.",
                        "That is why `dev` must be deliverable at all times."]
              report("`dev` is red.", lines)
              sys.exit(0)

          # ---- Point 2+3: review and open findings ---------------------------
          without, high = [], []
          DURCHSICHT = (os.environ.get("DURCHSICHT_NOETIG") or "ja").lower() == "ja"
          if not DURCHSICHT:
              print("The review is not required in this repo (no review-push.yml).")
              raw = ""
          else:
              raw = git("log", "%s..%s" % (basis, dev),
                        "--format=%H" + SEP + "%an" + SEP + "%s") or ""
              for line in raw.splitlines():
                  parts = line.split(SEP)
                  if len(parts) != 3:
                      continue
                  sha, author, subject = parts
                  if author.endswith("[bot]") or author in ("github-actions", "dependabot"):
                      continue
                  parents = (git("rev-list", "--parents", "-1", sha) or "").split()[1:]
                  if len(parents) > 1:
                      pulls = gh_json("repos/%s/commits/%s/pulls" % (REPO, sha)) or []
                      if any(p.get("merged_at") and p.get("merge_commit_sha") == sha
                             for p in pulls):
                          continue
                  # `--first-parent -m`: without the flags `git show` prints
                  # NOTHING for a merge, and every merge then looks code-free.
                  files = (git("show", "--name-only", "--format=",
                               "--first-parent", "-m", sha) or "").splitlines()
                  if not any(d.endswith(CODE) for d in files):
                      continue

                  # THE REVIEW COUNTS, WHEREVER IT IS (2026-08-25).
                  # There used to be only one place: `review-push.yml` attached
                  # it as a comment to the commit. Since `dev` only accepts
                  # merged PRs now, every branch commit belongs to a PR - and
                  # there it sits as a PR review, not at the commit. Whoever
                  # only reads the commit comment reports EVERY commit as
                  # "without review" from now on, and the gate never opens again.
                  # ONLY WHAT THE BOT WROTE (finding `hoch`, 2026-08-25).
                  # The recognition hung on the text in the body alone - and
                  # anyone with review rights may write that. A review pushed in
                  # afterwards with "Automated review" and without a finding
                  # table would have been picked below as the newest review and
                  # would have pushed the real findings aside: the gate would
                  # have opened with hoch=0.
                  # Measured who really writes it: github-actions[bot],
                  # type == "Bot". A human cannot set `type` to Bot.
                  # NOT affected: `#erledigt` / `#fehlalarm`. Those run over a
                  # separate regex on `comm` and are supposed to come from humans.
                  BOT = "github-actions[bot]"

                  def _review(k):
                      u = k.get("user") or {}
                      if u.get("type") != "Bot" or u.get("login") != BOT:
                          return False
                      t = k.get("body") or ""
                      return ("airforce-review-push" in t
                              or "Automatische Durchsicht" in t
                              or "Automated review" in t)

                  comm = gh_json("repos/%s/commits/%s/comments?per_page=100" % (REPO, sha)) or []
                  found = [c for c in comm if _review(c)]
                  # PR reviews carry `submitted_at` instead of `created_at` -
                  # without aligning them, `max(...)` below picks the wrong one
                  # as newest and reads the findings of an outdated version.
                  for p in (gh_json("repos/%s/commits/%s/pulls" % (REPO, sha)) or []):
                      nr = p.get("number")
                      if not nr:
                          continue
                      for r in (gh_json("repos/%s/pulls/%s/reviews?per_page=100"
                                        % (REPO, nr)) or []):
                          # ONLY A REVIEW AT EXACTLY THIS COMMIT.
                          # Finding `hoch` from the review, 2026-08-25, and it
                          # hits: a PR carries several commits, and each of its
                          # reviews would otherwise have counted for EVERY one
                          # of them. A commit pushed in afterwards would have
                          # slipped through unchecked - exactly the hole this
                          # gate is meant to close. `commit_id` says which state
                          # the review saw.
                          if _review(r) and r.get("commit_id") == sha:
                              found.append({"body": r.get("body") or "",
                                            "created_at": r.get("submitted_at") or "",
                                            "html_url": r.get("html_url") or ""})
                      # Answers (`#erledigt` / `#fehlalarm`) stand at the PR,
                      # not at the commit - otherwise an answered finding keeps
                      # counting as open.
                      comm += (gh_json("repos/%s/issues/%s/comments?per_page=100"
                                       % (REPO, nr)) or [])
                  if not found:
                      without.append((sha, subject))
                      continue

                  newest = max(found, key=lambda c: c.get("created_at") or "")
                  body = newest.get("body") or ""
                  m = re.search(r"airforce-schwere hoch=(\d+)", body)
                  # Old comments do not carry the marker - then read the table.
                  # If the marker is missing, nothing is waved through.
                  count = int(m.group(1)) if m else len(re.findall(r"\|\s*hoch\s*\|", body))
                  if count:
                      # WHO MAY ANSWER (review finding `hoch`, 28.08.2026).
                      # `#erledigt` / `#fehlalarm` closes a finding and opens
                      # the gate - and this regex ran over EVERY comment
                      # without ever looking at who wrote it. Anyone able to
                      # comment on the pull request could clear a finding; in
                      # the public `api-airforce-sdk` that is anybody at all.
                      #
                      # The comment above claimed this was safe because those
                      # answers `should come from humans`. A human is not the
                      # same as an authorised human - that was the gap.
                      #
                      # `author_association` is carried by both endpoints we
                      # read here, commit comments and PR issue comments.
                      # ...BUT `author_association` IS NOT A PERMISSION
                      # (second review finding `hoch`, 28.08.2026, and it is
                      # right). `MEMBER` only says `in the organisation` and
                      # `COLLABORATOR` covers read and triage as well - both
                      # would still open the gate.
                      #
                      # Tightening the association instead of replacing it
                      # was measured and rejected: the answers written here
                      # so far all carry `MEMBER`, so an `OWNER`-only test
                      # would lock out the very people who answer findings.
                      # Ask the repository what the author may actually do.
                      #
                      # The cheap tests run first, so the extra request
                      # happens only for a comment that carries a marker and
                      # is newer than the review it answers.
                      _rights = {}

                      def _write_right(login):
                          if not login:
                              return False
                          if login not in _rights:
                              d = gh_json("repos/%s/collaborators/%s/permission"
                                          % (REPO, login))
                              if d is None:
                                  # The lookup itself failed. Do not guess in
                                  # either direction - refuse, and say so
                                  # where someone will read it.
                                  print("::warning::cannot verify write access for "
                                        "%s - answer not counted" % login)
                              _rights[login] = (d or {}).get("permission") or ""
                          return _rights[login] in ("admin", "write")

                      def _is_answer(c):
                          if (c.get("created_at") or "") <= (newest.get("created_at") or ""):
                              return False
                          if not re.search(r"#erledigt|#fehlalarm", c.get("body") or "", re.I):
                              return False
                          return _write_right((c.get("user") or {}).get("login"))

                      answered = any(_is_answer(c) for c in comm)
                      if not answered:
                          high.append((sha, subject, count,
                                       newest.get("html_url") or ""))

          if without or high:
              lines = []
              if high:
                  lines += ["**Open findings of severity `hoch`** - fix first, then it continues:", ""]
                  for sha, subject, n, url in high:
                      lines.append("- `%s` %d finding(s) - %s  %s" % (sha[:8], n, subject, url))
                  lines += ["",
                            "Closing: attach a comment to THIS commit containing",
                            "`#erledigt` (fixed) or `#fehlalarm` (with a reason).",
                            "A false alarm is a valid answer - silently stepping",
                            "over it is not.", ""]
              if without:
                  lines += ["**Without an automated review:**", ""]
                  for sha, subject in without:
                      lines.append("- `%s` %s" % (sha[:8], subject))
                  lines += ["",
                            "Catching up: at the PR `gh workflow run review.yml --ref dev"
                            " -f pr=<NR>`, without a PR `gh workflow run review-push.yml"
                            " --ref dev -f sha=<SHA>`.", ""]
              report("`dev` is green, but the review is not complete.", lines)
              sys.exit(0)

          # ---- fast-forward ---------------------------------------------------
          r = subprocess.run(["git", "push", "origin", "%s:refs/heads/test" % dev],
                             capture_output=True, text=True)
          if r.returncode != 0:
              print("::error::Fast-forwarding `test` failed: %s" % r.stderr.strip()[:400])
              sys.exit(1)

          count = git("rev-list", "--count", "%s..%s" % (basis, dev)) or "?"
          # The sentence may only list what was ACTUALLY checked. If the review
          # is off, "every review present" is a claim about a step that did not
          # happen in this run at all.
          text = ("`test` %s onto `%s` (%s commit(s) from `dev`). All required checks green%s."
                  % ("created" if creating else "fast-forwarded", dev[:8], count,
                     ", every review present, no open finding `hoch`" if DURCHSICHT
                     else "; the review is NOT checked in this repo"))
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## test fast-forwarded\n\n%s\n" % text)
          close_issue(text)
          PYEOF
