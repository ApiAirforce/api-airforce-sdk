# Automated pull-request review - self-built, running entirely in our own
# Actions against our own model relay. No third-party service, no per-run fee.
#
# WHY THIS EXISTS INSTEAD OF A HOSTED REVIEW BOT: the hosted options charge for
# private repositories (Pullfrog: $30/month org plan; 30 free runs, then
# $0.07/run), and their control plane is not self-hostable. This file does the
# core of the job - read the diff, judge it, post a review - with nothing
# leaving infrastructure we control.
#
# CREDENTIALS: reuses the values already present in every repository:
#   secret PULLFROG_BASE_URL    OpenAI-compatible endpoint (our relay)
#   secret PULLFROG_API_KEY     its key
#   var    PULLFROG_MODEL       model id
# The PULLFROG_ prefix is historical - they were set for the Pullfrog trial and
# this reviewer took them over rather than duplicating a live key under a
# second name.
#
# SECURITY NOTES, both deliberate:
#   * Nothing from the PR (title, body, branch names) is interpolated into the
#     script below - everything arrives via env. A PR title containing shell or
#     ${{ }} syntax must stay data, not become code.
#   * On fork pull requests GitHub withholds secrets; the job then skips with a
#     notice instead of failing. It must never use pull_request_target to get
#     the secrets back - that combination (foreign code + real key) is the
#     classic self-inflicted leak.

name: review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        type: string
        description: PR number to review

concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # 40 INSTEAD OF 12 MINUTES (26 August 2026). Measured over the last 40
    # runs per repository: frontend 16 of 40 `cancelled` (40 %), status 9,
    # modshield 4 - all at this cap. `review-push.yml` has been at 40 for
    # exactly this reason since 23 August: the slowest
    # SUCCESSFUL run took 722 s against a cap of 720 s.
    # The same retry ladder (5/20/60 s) is in here; three attempts
    # cannot fit into twelve minutes by arithmetic.
    # Since `dev` accepts only merged PRs, THIS file is the
    # main path - and for the gate an aborted review is the same
    # as none: it holds up every window.
    timeout-minutes: 40
    steps:
      - name: Review the diff
        env:
          BASE: ${{ secrets.PULLFROG_BASE_URL }}
          KEY: ${{ secrets.PULLFROG_API_KEY }}
          MODEL: ${{ vars.PULLFROG_MODEL }}
          CONTEXT: ${{ vars.PULLFROG_CONTEXT }}
          MAX_OUTPUT: ${{ vars.PULLFROG_MAX_OUTPUT }}
          # Requested service tier: priority (default when unset), fast, none or off.
          SERVICE_TIER: ${{ vars.PULLFROG_SERVICE_TIER }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys, time, urllib.error, urllib.request

          BASE = (os.environ.get("BASE") or "").rstrip("/")
          KEY = os.environ.get("KEY") or ""
          MODEL = os.environ.get("MODEL") or "gpt-6-sol"
          # FAST MODE: unset requests `priority`, `fast` is the documented alias and none/off
          # sends no tier. Only a known tier named by the answer counts; else UNVERIFIED.
          SERVICE_TIER = {"": "priority", "priority": "priority", "fast": "fast", "none": "",
                          "off": ""}.get((os.environ.get("SERVICE_TIER") or "").strip().lower())
          if SERVICE_TIER is None:
              sys.exit("Model call failed: PULLFROG_SERVICE_TIER must be priority, fast, none or off")
          KNOWN_TIERS, OBSERVED_TIERS = ("priority", "fast", "default", "flex", "auto", "scale"), []
          REPO = os.environ["REPO"]
          PR = os.environ.get("PR_NUM") or ""
          # HOW MUCH DIFF FITS IN ONE PASS - DERIVED, NOT DECLARED.
          #
          # This was a flat `MAX_DIFF = 160_000`, and the diff was cut with a plain
          # `diff[:MAX_DIFF]` - mid-line, mid-hunk, without naming what fell away.
          # Measured on the release review of backend#409 over 28 commits: it ends
          # with "diff truncated at 160k chars; only the visible part was judged"
          # and still found a real high finding in what it could see. Nobody knows
          # what was in the rest.
          #
          # The repository already carries the two numbers that decide the size -
          # `PULLFROG_CONTEXT` and `PULLFROG_MAX_OUTPUT` - and this workflow read
          # neither. Deriving it means the size follows the model. The chars-per-
          # token figure is deliberately low: a unified diff is dense in punctuation
          # and short tokens, so 3.2 under-estimates rather than over-fills, and
          # over-filling is a hard failure at the relay.
          CONTEXT = int(os.environ.get("CONTEXT") or 400_000)
          MAX_OUT = int(os.environ.get("MAX_OUTPUT") or 8_000)
          # Room for the system prompt, the JSON envelope and the answer.
          MAX_DIFF = max(40_000, int((CONTEXT - MAX_OUT - 4_000) * 3.2))
          print(f"context={CONTEXT} max_out={MAX_OUT} -> {MAX_DIFF} chars per batch",
                file=sys.stderr)

          # BEGIN REVIEW_BATCH_HELPERS
          _AT = re.compile(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@")

          DATA_FILE = re.compile(
              r"(^|/)(locales/[^/]+\.json|package-lock\.json|[^/]*\.lock"
              r"|[^/]*\.generated\.[a-z]+|[^/]*snapshot[^/]*\.json)$")
          UNKNOWN_PATH = "(unknown diff payload)"

          class _UnsplittableDiff(RuntimeError):
              """A diff part cannot be divided without silently losing content."""

          def _git_c_unquote(token):
              """Decode one complete Git C-quoted path token."""
              if not token.startswith('"'):
                  return token
              if len(token) < 2 or not token.endswith('"'):
                  return None
              data, i, body = bytearray(), 0, token[1:-1]
              escapes = {"a": 7, "b": 8, "t": 9, "n": 10, "v": 11,
                         "f": 12, "r": 13, '"': 34, "\\": 92}
              while i < len(body):
                  char = body[i]
                  if char != "\\":
                      data.extend(char.encode("utf-8", "surrogateescape"))
                      i += 1
                      continue
                  i += 1
                  if i >= len(body):
                      return None
                  char = body[i]
                  if char in escapes:
                      data.append(escapes[char])
                      i += 1
                  elif char in "01234567":
                      end = i + 1
                      while end < min(i + 3, len(body)) and body[end] in "01234567":
                          end += 1
                      data.append(int(body[i:end], 8))
                      i = end
                  else:
                      return None
              return data.decode("utf-8", "surrogateescape")

          def _git_path_value(raw):
              """Read one Git metadata pathname without splitting ordinary spaces."""
              token = raw.rstrip("\r\n")
              # An unquoted tab can only introduce the optional timestamp field;
              # literal tabs are C-quoted by Git.
              if not token.startswith('"'):
                  token = token.split("\t", 1)[0]
              value = _git_c_unquote(token)
              if not value:
                  raise ValueError(f"invalid Git path token: {raw!r}")
              return value

          def diff_marker_path(line, prefix):
              """Decode an authoritative ---/+++ marker and remove a/ or b/."""
              if not (line.startswith("--- ") or line.startswith("+++ ")):
                  raise ValueError(f"not a Git file marker: {line!r}")
              value = _git_path_value(line[4:])
              if value == "/dev/null":
                  return None
              if not value.startswith(prefix):
                  raise ValueError(
                      f"Git file marker does not start with {prefix!r}: {line!r}")
              return value[len(prefix):]

          def diff_target_path(body):
              """Derive the target path only from metadata before the first hunk."""
              source_seen, source = False, None
              rename_target = copy_target = None
              for line in body.splitlines(keepends=True):
                  if line.startswith("@@"):
                      break
                  if line.startswith("--- "):
                      source_seen = True
                      source = diff_marker_path(line, "a/")
                  elif line.startswith("+++ "):
                      target = diff_marker_path(line, "b/")
                      if target is not None:
                          return target
                      return source if source_seen and source is not None else UNKNOWN_PATH
                  elif line.startswith("rename to "):
                      rename_target = _git_path_value(line[len("rename to "):])
                  elif line.startswith("copy to "):
                      copy_target = _git_path_value(line[len("copy to "):])
              return rename_target or copy_target or UNKNOWN_PATH

          def diff_chunks(raw_diff):
              """Group complete file diffs before deriving any pathname."""
              if not raw_diff.strip():
                  return []
              bodies, current = [], []
              for line in raw_diff.splitlines(keepends=True):
                  if line.startswith("diff --git ") and current:
                      bodies.append("".join(current))
                      current = []
                  current.append(line)
              if current:
                  bodies.append("".join(current))
              return [(diff_target_path(body), body) for body in bodies]

          def dropped_paths(parts):
              """Keep an explicit label even when a batch path is unknown."""
              return [path or UNKNOWN_PATH for path, _ in parts]

          def changed_path_manifest(raw_diff):
              """Return each derived target path once, in diff order."""
              return list(dict.fromkeys(path for path, _ in diff_chunks(raw_diff)))

          def batch_paths(parts):
              """Return each path represented by one batch once."""
              return list(dict.fromkeys(path or UNKNOWN_PATH for path, _ in parts))

          def body_only_findings(findings):
              """Copy global findings without pretending they have diff positions."""
              result = []
              for finding in findings:
                  item = dict(finding)
                  item.pop("line", None)
                  result.append(item)
              return result

          def make_batch_report(batch_id, paths, summary, facts, findings):
              """Keep the structured evidence required by the global pass."""
              return {
                  "batch_id": batch_id,
                  "paths": list(paths),
                  "summary": summary,
                  "cross_batch_facts": list(facts),
                  "findings": list(findings),
              }

          def reports_cover_manifest(changed_paths, reports):
              """Require successful reports to cover exactly the changed manifest."""
              reported = {
                  path
                  for report in reports
                  for path in report.get("paths", [])
              }
              return bool(reports) and reported == set(changed_paths)

          def reconciliation_text(changed_paths, reports):
              """Build one indivisible final request from every structured report."""
              envelope = {
                  "changed_paths": list(changed_paths),
                  "batch_reports": list(reports),
              }
              return (
                  "Perform the mandatory global reconciliation. The JSON envelope "
                  "contains the complete changed-path manifest and every successful "
                  "batch report. Do not omit a report or path.\n\n"
                  + json.dumps(envelope, ensure_ascii=False, separators=(",", ":"))
              )

          def _exact_coverage(actual, expected):
              """Accept each expected unique string exactly once, in any order."""
              return (
                  isinstance(actual, list)
                  and all(isinstance(item, str) for item in actual)
                  and len(actual) == len(expected)
                  and set(actual) == set(expected)
              )

          def review_envelope_is_valid(verdict):
              """Require every top-level review field instead of defaulting it."""
              return (
                  isinstance(verdict, dict)
                  and bool(verdict)
                  and verdict.get("verdict") in ("lgtm", "findings")
                  and "summary" in verdict
                  and isinstance(verdict["summary"], str)
                  and "cross_batch_facts" in verdict
                  and isinstance(verdict["cross_batch_facts"], list)
                  and all(isinstance(fact, str) and fact.strip()
                          for fact in verdict["cross_batch_facts"])
                  and "findings" in verdict
                  and isinstance(verdict["findings"], list)
                  and (verdict.get("verdict") != "findings"
                       or bool(verdict["findings"]))
              )

          def parse_reconciliation_response(text, expected_batches, expected_paths):
              """Parse the final body-only review and prove exact input coverage."""
              match = re.search(r"\{.*\}", text, re.S)
              broken = False
              try:
                  verdict = json.loads(match.group(0)) if match else {}
              except ValueError:
                  verdict = {}

              # Validate sibling fields independently. A malformed receipt or
              # summary keeps reconciliation incomplete, but must not erase a
              # security finding that can still be validated safely.
              if not isinstance(verdict, dict) or not verdict:
                  verdict, broken = {}, True
              if verdict.get("verdict") not in ("lgtm", "findings"):
                  broken = True

              if "summary" not in verdict or not isinstance(
                      verdict.get("summary"), str):
                  summary, broken = text.strip()[:2000], True
              else:
                  summary = verdict["summary"] or text.strip()[:2000]

              raw_facts = verdict.get("cross_batch_facts")
              if (not isinstance(raw_facts, list)
                      or not all(isinstance(fact, str) and fact.strip()
                                 for fact in raw_facts)):
                  broken = True

              raw_findings = verdict.get("findings")
              if not isinstance(raw_findings, list):
                  raw_findings, broken = [], True
              findings, invalid_findings = normalize_findings(
                  raw_findings, require_line=False)
              broken = broken or invalid_findings
              if verdict.get("verdict") == "findings" and not raw_findings:
                  broken = True

              if (not _exact_coverage(
                      verdict.get("covered_batches"), expected_batches)
                      or not _exact_coverage(
                          verdict.get("covered_paths"), expected_paths)):
                  broken = True
              return summary, findings, broken

          def _split_file(path, body, limit):
              """A single file bigger than one batch, cut at hunk boundaries.
          
              Cutting mid-hunk makes the rest unreadable: the `@@ -a,b +c,d @@`
              header carries the line numbers, and without it the review cannot
              name a line any more. So the split happens at `@@`, and the
              `diff --git` header is repeated on every part.
              """
              zeilen = body.splitlines(keepends=True)
              kopf, rest = [], []
              for i, l in enumerate(zeilen):
                  if l.startswith("@@"):
                      kopf, rest = zeilen[:i], zeilen[i:]
                      break
              else:
                  # A large diff without hunk boundaries cannot be split while
                  # preserving usable line positions. The old body[:limit] fallback
                  # silently discarded the suffix and still allowed a complete marker.
                  # Fail before posting any marker instead.
                  if len(body) > limit:
                      raise _UnsplittableDiff(
                          f"{path or '(unknown diff)'} is {len(body)} characters but "
                          f"has no hunk boundary and cannot be split at {limit}")
                  return [(path, body)]
              kopftext = "".join(kopf)
              budget = max(1, limit - len(kopftext))

              # GATHER THE HUNKS FIRST, PACK SECOND.
              #
              # The first version decided at the `@@` line whether the next hunk
              # still fit, using the length of THAT ONE LINE - the hunk behind it
              # had not been measured yet. Two hunks at 60 % of the budget each
              # therefore both landed in the same part, and it went out at 120 %.
              # The reviewer found this on this very change; the test here used 60
              # small hunks and never built one large enough to show it.
              #
              # Not cosmetic: the shrink-on-refusal loop halves the limit and
              # retries, and a packer that can exceed its own limit by a whole hunk
              # leaves that loop unable to converge.
              hunks, cur = [], []
              for l in rest:
                  if l.startswith("@@") and cur:
                      hunks.append("".join(cur))
                      cur = []
                  cur.append(l)
              if cur:
                  hunks.append("".join(cur))

              # A SINGLE HUNK OVER BUDGET STILL HAS TO GO SOMEWHERE.
              #
              # The first attempt repeated the hunk header verbatim on every
              # continuation, so each part claimed to start at the hunk's first line
              # and an inline finding on a continuation landed on the wrong line or
              # was thrown out in validation. The reviewer was right that this does
              # not have to be a trade-off: the positions can be carried along.
              # `_kopf_ab` counts what has been consumed and emits a header that is
              # true for the part it heads.
              #
              # The size check now uses the prefix the part will ACTUALLY carry, and
              # it is applied to the first line of a fresh piece too. Before, a line
              # after a flush went in unchecked and the first flush computed with the
              # shorter header - so one long line still produced an oversized part,
              # and an oversized part can be refused even at the 40,000 floor. Same
              # defect as the one above, one level down.
              zerlegt = []
              for h in hunks:
                  if len(h) <= budget:
                      zerlegt.append(h)
                      continue
                  zeilen_h = h.splitlines(keepends=True)
                  kopfzeile = zeilen_h[0]
                  m_at = _AT.match(kopfzeile)
                  stueck, laenge = [], 0
                  alt_ab = neu_ab = 0        # already consumed lines, old and new
                  alt_h = neu_h = 0          # in the current piece
                  erstes = True

                  def _kopf(a, n):
                      """The header for a part that starts a old / n new lines later."""
                      if not m_at or (a == 0 and n == 0):
                          return kopfzeile
                      # A missing count means length 1, not length 0.
                      a1, b1, c1, d1 = (int(x) if x is not None else 1
                                        for x in m_at.groups()[:4])
                      return "@@ -%d,%d +%d,%d @@ (continued)\n" % (
                          a1 + a, max(0, b1 - a), c1 + n, max(0, d1 - n))

                  for l in zeilen_h[1:]:
                      _marke = l[:1]   # the real marker, before any cut
                      praefix = _kopf(alt_ab, neu_ab)
                      if laenge + len(l) + len(praefix) > budget:
                          if stueck:
                              zerlegt.append(praefix + "".join(stueck))
                              alt_ab += alt_h
                              neu_ab += neu_h
                              stueck, laenge, alt_h, neu_h = [], 0, 0, 0
                              praefix = _kopf(alt_ab, neu_ab)
                          # A SINGLE LINE THAT DOES NOT FIT ON ITS OWN IS SPLIT.
                          # Ugly, but bounded. Letting it through unsplit would mean
                          # delivering a part above the limit, and that is exactly where
                          # the fallback fails.
                          # SAVE THE MARKER BEFORE CUTTING.
                          #
                          # The loop below cuts from the front of `l`. Afterwards the payload
                          # sits there, and `l[:1]` takes an arbitrary character for the
                          # diff marker - the line is counted not at all or on the wrong side,
                          # and every following continuation is off again.
                          _marke = l[:1]
                          while len(l) + len(praefix) > budget:
                              platz = max(1, budget - len(praefix))
                              zerlegt.append(praefix + l[:platz])
                              l = l[platz:]
                      stueck.append(l)
                      laenge += len(l)
                      k = _marke
                      if k in (" ", "-"):
                          alt_h += 1
                      if k in (" ", "+"):
                          neu_h += 1
                  if stueck:
                      zerlegt.append(_kopf(alt_ab, neu_ab) + "".join(stueck))

              teile, cur, used = [], [], 0
              for h in zerlegt:
                  if cur and used + len(h) > budget:
                      teile.append((path, kopftext + "".join(cur)))
                      cur, used = [], 0
                  cur.append(h)
                  used += len(h)
              if cur:
                  teile.append((path, kopftext + "".join(cur)))
              if not teile:
                  raise _UnsplittableDiff(
                      f"{path or '(unknown diff)'} could not be split without "
                      "discarding content")
              return teile

          def budget_batches(raw_diff, limit=MAX_DIFF):
              """Split the diff into batches of at most `limit` chars each.
          
              THE OLD VERSION DROPPED WHAT DID NOT FIT and named it. That is how
              161 of 589 reviews across the two repos - more than a quarter - went
              out having seen only part of the change. A gate that checks "a review
              exists" turns green on one of those, and the half nobody looked at is
              indistinguishable from a half with no defects.
          
              Now every batch gets its own pass and the findings are merged. Only
              the wall-clock cap can still leave something out, and the caller says
              so by name when it does.
          
              The order stays: code first, data files last. If time does run out,
              what is missing is a translation file rather than Rust.
              """
              chunks = diff_chunks(raw_diff)
              if not chunks:
                  return []
              chunks.sort(key=lambda c: 1 if DATA_FILE.search(c[0] or "") else 0)
              flach = []
              for p, body in chunks:
                  flach.extend(_split_file(p, body, limit) if len(body) > limit else [(p, body)])
              stapel, cur, used = [], [], 0
              for p, body in flach:
                  if cur and used + len(body) > limit:
                      stapel.append(cur)
                      cur, used = [], 0
                  cur.append((p, body))
                  used += len(body)
              if cur:
                  stapel.append(cur)
              return stapel

          def resplit_batch(parts, current_limit, floor=40_000):
              """Shrink a refused batch from its actual payload, not its ceiling."""
              raw_diff = "".join(body for _, body in parts)
              actual_size = len(raw_diff)
              if actual_size <= floor:
                  return None, []
              next_limit = max(
                  floor, min(current_limit // 2, actual_size // 2)
              )
              if next_limit >= actual_size:
                  return None, []
              batches = budget_batches(raw_diff, next_limit)
              child_sizes = [sum(len(body) for _, body in batch)
                             for batch in batches]
              if (len(batches) <= 1 or not child_sizes
                      or max(child_sizes) >= actual_size):
                  return None, []
              return next_limit, batches
          # END REVIEW_BATCH_HELPERS

          class _ZuGross(Exception):
              """The upstream refused the request for its SIZE, not its content.
          
              `PULLFROG_CONTEXT` is a declared number, not a measured one - the
              catalog carries no context length for this model at all, so
              whatever stands in the variable is somebody's belief. Believing it
              too hard would turn one wrong variable into every review failing
              hard on every large diff. So a size refusal halves the batch and
              tries again instead of ending the run.
              """
          
          
          # BEGIN REVIEW_SIZE_HELPERS
          def _ist_zu_gross(text, error_type=""):
              """Does this error say the request was too large?
          
              Input/context signals take precedence over output-option wording:
              a relay may report that input and output together exceed the context
              window. Rate-limit signals are never a reason to split the diff.
              """
              t = (text or "").lower()
              typ = (error_type or "").lower()
              if typ in ("rate_limit", "rate_limit_error"):
                  return False
              if typ in ("context_length_exceeded", "context_length_error",
                         "request_too_large"):
                  return True
              if any(w in t for w in (
                  "rate limit", "rate_limit", "per minute", "tokens/min",
                  "requests per minute")):
                  return False
              if any(w in t for w in (
                  "context length", "context_length", "context window",
                  "maximum context", "too many input tokens",
                  "input is too long", "prompt is too long",
                  "request too large", "request is too large",
                  "request_too_large", "string_above_max_length")):
                  return True
              has_input_subject = any(w in t for w in (
                  "context", "input", "prompt", "payload",
                  "request body", "request size"))
              has_size_signal = any(w in t for w in (
                  "too large", "too long", "too many", "exceed",
                  "maximum length", "max length", "size limit",
                  "reduce the length"))
              if has_input_subject and has_size_signal:
                  return True
              output_subject = any(w in t for w in (
                  "max_completion_tokens", "max_tokens", "output token",
                  "response"))
              output_size_signal = any(w in t for w in (
                  "too large", "too long", "too many", "exceed"))
              if output_subject and output_size_signal:
                  return False
              return "too many tokens" in t


          def _http_ist_zu_gross(status, body, reason=""):
              """HTTP 413 is size; HTTP 429 is rate regardless of its wording."""
              return status == 413 or (status != 429 and (
                  _ist_zu_gross(body) or _ist_zu_gross(reason)))
          # END REVIEW_SIZE_HELPERS

          if not KEY or not BASE:
              # Fork PRs get no secrets. That is correct and not an error - but it
              # must be said out loud, not passed off as a completed review.
              print("No model credentials in this context (fork PR?) - review skipped.")
              sys.exit(0)
          if not PR:
              print("No PR number - nothing to review.", file=sys.stderr)
              sys.exit(2)

          def gh(*args, raw=False):
              r = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stderr[:400], file=sys.stderr)
                  sys.exit(2)
              return r.stdout if raw else json.loads(r.stdout)

          # BEGIN REVIEW_MARKER_HELPERS
          REVIEW_BOT = "github-actions[bot]"
          SUBMITTED_REVIEW_STATES = {"COMMENTED", "APPROVED", "CHANGES_REQUESTED"}


          def complete_review_marker(sha):
              return f"<!-- airforce-review {sha} -->"


          def incomplete_review_marker(sha):
              # Keep this substring-disjoint from the legacy complete marker:
              # older gates used a broad `airforce-review` substring test.
              return f"<!-- airforce-incomplete-review {sha} -->"


          def has_exact_marker_line(body, marker):
              return bool(re.search(
                  rf"^{re.escape(marker)}\r?$", body or "", re.M))


          def legacy_review_incomplete(body):
              """Recognise incomplete reviews posted before they had their own marker."""
              notices = (
                  r"^_not reviewed - the wall-clock cap was reached:",
                  r"^_nicht beurteilt, weil die zeitkappe erreicht war:",
                  r"^> \*\*the model answer was not usable json\.\*\*",
                  r"^> \*\*die modellantwort war kein verwertbares json\.\*\*",
              )
              return any(re.search(notice, body or "", re.I | re.M)
                         for notice in notices)


          def review_is_complete(body, sha):
              text = body or ""
              if legacy_review_incomplete(text):
                  return False
              if has_exact_marker_line(text, incomplete_review_marker(sha)):
                  return False
              return has_exact_marker_line(text, complete_review_marker(sha))


          def is_complete_bot_review(review, sha):
              user = review.get("user") or {}
              return (user.get("type") == "Bot"
                      and user.get("login") == REVIEW_BOT
                      and str(review.get("state") or "").upper()
                          in SUBMITTED_REVIEW_STATES
                      and review_is_complete(review.get("body") or "", sha))


          def flatten_paginated_lists(pages):
              if not isinstance(pages, list):
                  raise ValueError("paginated GitHub response is not a page list")
              items = []
              for page in pages:
                  if not isinstance(page, list):
                      raise ValueError("paginated GitHub response contains a non-list page")
                  items.extend(page)
              return items


          def normalize_severity(value):
              if (not isinstance(value, str)
                      or value not in {"high", "medium", "low"}):
                  raise ValueError(f"unsupported review severity: {value!r}")
              return value


          def normalize_findings(raw_findings, require_line=True):
              """Validate local and global finding schemas without rewriting paths."""
              findings, invalid = [], False
              for finding in raw_findings:
                  if not isinstance(finding, dict):
                      invalid = True
                      continue
                  path = finding.get("path")
                  note = finding.get("note")
                  line = finding.get("line")
                  if (not isinstance(path, str) or not path.strip()
                          or not isinstance(note, str) or not note.strip()
                          or (require_line and (
                              type(line) is not int or line < 1))
                          or (not require_line and line is not None and (
                              type(line) is not int or line < 1))):
                      invalid = True
                      continue
                  try:
                      severity = normalize_severity(finding.get("severity"))
                  except ValueError:
                      severity = "high"
                      invalid = True
                  finding = dict(finding)
                  finding["severity"] = severity
                  findings.append(finding)
              return findings, invalid


          def severity_marker(findings):
              levels = [normalize_severity(f.get("severity")) for f in findings]
              high = sum(level == "high" for level in levels)
              medium = sum(level == "medium" for level in levels)
              return f"<!-- airforce-schwere hoch={high} mittel={medium} -->"

          def gh_paginated_list(path):
              return flatten_paginated_lists(
                  gh(path, "--paginate", "--slurp"))
          # END REVIEW_MARKER_HELPERS

          pr = gh(f"repos/{REPO}/pulls/{PR}")
          head = os.environ.get("HEAD_SHA") or pr["head"]["sha"]

          # Idempotence: only a complete review suppresses a re-run. An incomplete
          # review must remain retryable, and only the workflow bot can satisfy it.
          for rv in gh_paginated_list(
                  f"repos/{REPO}/pulls/{PR}/reviews?per_page=100"):
              if is_complete_bot_review(rv, head):
                  print(f"Review for {head[:7]} already posted - nothing to do.")
                  sys.exit(0)

          diff = gh(f"repos/{REPO}/pulls/{PR}", "-H", "Accept: application/vnd.github.v3.diff", raw=True)
          # THE TAIL IS NO LONGER THROWN AWAY.
          #
          # `diff = diff[:MAX_DIFF]` cut mid-line and mid-hunk and named nothing.
          # The review then said "judge what is visible" and passed as a completed
          # review, which is the same shape as a review that found nothing.
          stapel = budget_batches(diff)
          if not stapel:
              print("Empty diff - nothing to review.")
              sys.exit(0)
          manifest = changed_path_manifest(diff)
          if not manifest:
              print("The diff has no reviewable changed-path manifest.", file=sys.stderr)
              sys.exit(1)
          print(f"diff split into {len(stapel)} batch(es)", file=sys.stderr)

          # Public repository -> English (community-facing); internal -> German.
          english = REPO.endswith("api-airforce-sdk")
          lang = "English" if english else "German"

          system = (
              "You are a strict senior code reviewer for the api.airforce platform "
              "(AI model gateway; Rust backend, Next.js frontend, money-handling code). "
              "Review the diff for REAL defects only: logic errors, billing/money-path "
              "mistakes, security problems, silently swallowed errors, race conditions, "
              "missing i18n keys (all 19 locales must stay in sync). Do NOT comment on "
              "formatting or style - separate CI jobs own that. If the change is sound, "
              "say so briefly. Never invent line numbers: only reference lines that "
              f"appear in the diff. Write all prose in {lang}. "
              'Answer with STRICT JSON only, no code fences: {"verdict":"lgtm"|"findings",'
              '"summary":"...","cross_batch_facts":["..."],'
              '"findings":[{"path":"...","line":123,'
              '"severity":"high"|"medium"|"low","note":"..."}]} '
              '- "line" must be a line number in the NEW version of the file, taken from '
              "the diff hunk headers. Record every changed API, schema, locale, billing, "
              "permission, or configuration contract that another batch may need to "
              "verify in cross_batch_facts, even when it is not locally defective. "
              "Omit findings you are not confident about."
          )
          reconciliation_system = (
              "You are the mandatory final reconciliation pass for a batched code review. "
              "The user message contains the complete changed-path manifest and every "
              "structured batch report. Find only additional defects that become visible "
              "across batches, especially mismatched APIs or schemas, missing locale "
              "companions, billing inconsistencies, permission gaps, and configuration "
              "contracts. Do not discard or rewrite local findings. "
              f"Write the summary and finding notes in {lang}. "
              'Answer with STRICT JSON only: {"verdict":"lgtm"|"findings",'
              '"summary":"...","cross_batch_facts":[],'
              '"findings":[{"path":"...",'
              '"severity":"high"|"medium"|"low","note":"..."}],'
              '"covered_batches":["batch-1"],"covered_paths":["path"]}. '
              "This pass has no raw diff hunks, so its findings are review-body-only: "
              "never include or guess line numbers. Copy every batch id and every changed "
              "path from the input exactly once."
          )
          def stapel_text(nr, gesamt, teile):
              """The user message for one batch."""
              kopf = f"PR #{PR} - {pr.get('title','')!s}"
              if gesamt > 1:
                  kopf += (f"\n\nThis is batch {nr} of {gesamt}. Review the raw diff "
                           "below and record every relation another batch must verify. "
                           "A mandatory final pass will reconcile all reports.")
              kopf += ("\n\nComplete changed-path manifest:\n"
                       + json.dumps(manifest, ensure_ascii=False))
              return kopf + "\n\n" + "".join(b for _, b in teile)

          class _RelayFehler(Exception):
              """The relay reported an error - with HTTP 200 in the body.

              `typ` carries the machine-readable error type, because not
              every 200 error is a rate limit: an auth or request error
              does not change by waiting, and three retries then only
              cost 85 s for the same answer.

              Measured: `{"error":{"type":"rate_limit_error"}}` came back
              with status 200. The retry ladder only knew HTTPError and
              network errors and saw no error in it - the call fell
              back to the non-streaming path, got the same answer
              and ran into the job time limit. A 2XX PROVES NO DELIVERY.
              """

              def __init__(self, text, typ=""):
                  super().__init__(text)
                  self.typ = (typ or "").lower()


          def _relay_fehler(d):
              """Does the response carry an error object? Then its text."""
              if not isinstance(d, dict):
                  return None
              f = d.get("error")
              if not f:
                  return None
              if isinstance(f, dict):
                  return (str(f.get("message") or f.get("type") or f)[:200],
                          str(f.get("type") or ""))
              return (str(f)[:200], "")


          class _StromUnbrauchbar(Exception):
              """The stream cannot be used as a review.

              A class of its own so that the retry ladder does NOT treat
              it as a network error: fetching the same empty answer three
              times only costs time - exactly that happened on the first
              attempt (5 s, 20 s, 60 s pause, empty three times). The
              caller instead falls back once to the
              non-streaming path.
              """


          def _stroemen(payload):
              """Read the stream and build the same shape as otherwise.

              The rest of the script reads `out["choices"][0]["message"]["content"]`
              and `out["usage"]` - both are assembled here so that nothing
              downstream has to be touched.
              """
              req = urllib.request.Request(
                  BASE + "/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {KEY}",
                           "Content-Type": "application/json",
                           "Accept": "text/event-stream"},
                  method="POST")
              stuecke, usage, probe, grund, tier = [], {}, [], "", None
              # `fertig` records whether the stream ended PROPERLY.
              # `kaputt` counts events that could not be read.
              fertig, kaputt = False, 0
              # 180 s applies here per READ, not to the whole call:
              # as long as bytes arrive, it keeps going. An answer may therefore
              # take ten minutes - it just must not stay silent for three.
              with urllib.request.urlopen(req, timeout=180) as resp:
                  # WHOEVER IGNORES `stream: true` SENDS PLAIN JSON.
                  # Then no line starts with `data:` - below, EVERYTHING
                  # would be discarded, `probe` would stay empty, and the same
                  # prompt would go out a SECOND time. The first answer
                  # has already been generated AND BILLED by then.
                  # So detect it by the content type and take it over directly -
                  # that is also the `message.content` path that the
                  # comment further below provides for.
                  if "event-stream" not in (resp.headers.get_content_type() or ""):
                      try:
                          ganz = json.loads(resp.read().decode("utf-8", "replace"))
                      except ValueError:
                          raise _StromUnbrauchbar("Antwort war weder SSE noch JSON")
                      _f = _relay_fehler(ganz)
                      if _f:
                          # An error object here is NOT an unusable
                          # stream: treated as one, it triggered an
                          # unnecessary second call instead of going straight
                          # to the ladder.
                          raise _RelayFehler(*_f)
                      w = (ganz.get("choices") or [{}])[0]
                      t = (((w.get("message") or {}).get("content") or "")
                           or ((w.get("delta") or {}).get("content") or ""))
                      if not t.strip():
                          raise _StromUnbrauchbar(
                              "Antwort ohne Strom und ohne Inhalt")
                      print("relay stroemt nicht - Antwort direkt uebernommen",
                            file=sys.stderr)
                      return {"choices": [{"message": {"content": t}}],
                              "usage": ganz.get("usage") or {},
                              "service_tier": ganz.get("service_tier")}
                  def _ereignisse(strom):
                      """SSE events instead of lines.

                      An event ends at the BLANK LINE, not at the
                      line break, and may carry several `data:` lines
                      that belong together, joined by line breaks.
                      Parsing per line splits exactly such
                      events, counts them as broken and triggers a
                      second, BILLED call - for nothing.
                      """
                      teile = []
                      for roh in strom:
                          z = roh.decode("utf-8", "replace").rstrip("\r\n")
                          if z:
                              if z.startswith("data:"):
                                  teile.append(z[5:].lstrip())
                              continue
                          if teile:
                              yield chr(10).join(teile)
                              teile = []
                      # A last event without a closing blank line
                      # is not an error - the stream simply ends.
                      if teile:
                          yield chr(10).join(teile)

                  for nutz in _ereignisse(resp):
                      if nutz == "[DONE]":
                          fertig = True
                          break
                      try:
                          brocken = json.loads(nutz)
                      except ValueError:
                          # NOTHING MORE FOLLOWS HERE. `_ereignisse` reads
                          # COMPLETE lines and whole events - half a JSON object
                          # cannot arrive, and the next chunk brings
                          # nothing more. Whatever fails here
                          # is gone for good. Count it instead of hiding it:
                          # below, it decides the fallback.
                          kaputt += 1
                          continue
                      if len(probe) < 3:
                          probe.append(nutz[:300])
                      _f = _relay_fehler(brocken)
                      if _f:
                          # An error object in the stream is not an empty stream.
                          # Treated as one, it led to the fallback, which
                          # fetches the same error - and runs into the time limit.
                          raise _RelayFehler(*_f)
                      if brocken.get("usage"):
                          usage = brocken["usage"]
                      tier = brocken.get("service_tier") or tier
                      for w in brocken.get("choices") or []:
                          # RECORD THE FINISH REASON. If it is
                          # `content_filter` or `length`, the answer was
                          # complete and therefore PAID FOR - then the log
                          # below says why it was empty, instead of someone
                          # having to guess again.
                          if w.get("finish_reason"):
                              grund = w["finish_reason"]
                          # Not only `delta.content`: a relay that passes a
                          # non-streaming call through puts the text
                          # into `message.content`. Take both forms
                          # instead of relying on one that nobody
                          # has measured.
                          for feld in ("delta", "message"):
                              # A REFUSAL CARRIES ITS TEXT IN `refusal`,
                              # NOT IN `content`. Without this field a
                              # completed, paid refusal looks like
                              # an empty stream - and triggers the fallback,
                              # that is, a SECOND paid
                              # call of the same prompt that brings back the same
                              # refusal. Taking the text
                              # is better than any abort: the review
                              # gets an answer instead of an error.
                              _w = w.get(feld) or {}
                              teil = (_w.get("content")
                                      or _w.get("refusal"))
                              if teil:
                                  stuecke.append(teil)
                                  break
              text = "".join(stuecke)
              if not text.strip():
                  # NO SILENT PASS, BUT NO TOTAL FAILURE EITHER.
                  # Measured on 25 August: the relay accepts `stream: true`
                  # but delivers no text. Which shape it sends instead
                  # is in the log from now on - that is the
                  # only way to see it instead of guessing it.
                  print("Strom ohne Inhalt (grund=%r, usage=%s). "
                        "Erste Brocken: %r"
                        % (grund, bool(usage), probe),
                        file=sys.stderr)
                  raise _StromUnbrauchbar("Strom ohne Inhalt")
              if not fertig:
                  # EOF IS NOT A COMPLETION. Without `[DONE]` there is text here,
                  # but only the beginning - if a layer cuts the
                  # stream after a few deltas, the result looks like
                  # "little found". Exactly the confusion this
                  # reviewer is built against. Better slow and complete.
                  raise _StromUnbrauchbar(
                      "Strom endete ohne [DONE] nach %d Zeichen" % len(text))
              if kaputt:
                  # An unreadable event may have carried text that
                  # is now missing. A review with holes is worse
                  # than a slow one.
                  raise _StromUnbrauchbar("%d unlesbare Ereignisse im Strom" % kaputt)
              return {"choices": [{"message": {"content": text}}], "usage": usage,
                      "service_tier": tier}

          def call(payload):
              req = urllib.request.Request(
                  BASE + "/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {KEY}", "Content-Type": "application/json"},
                  method="POST")
              # STREAM, DO NOT GO SILENT (25 August 2026). Measured: our backend
              # answers in 23-31 s (max 80 s) and logged ONE error in a day;
              # nginx reported ONE 502. Yet the reviewer jobs took
              # 283 s on average, up to 1812 s, and 18 of 195 died of
              # `RemoteDisconnected` or `TimeoutError` after 600 s. So the
              # failed requests never reached our backend - a connection
              # that carries no byte for minutes is cleared by the layer
              # in front of it, and the client notices only when it reads.
              #
              # In a stream, bytes flow from the first reasoning step. The cap
              # thus sits on the FIRST BYTE instead of the total duration - a
              # total limit does not limit silence.
              strom = dict(payload)
              strom["stream"] = True
              strom["stream_options"] = {"include_usage": True}
              try:
                  return _stroemen(strom)
              except _RelayFehler as e:
                  if getattr(e, "typ", "") != "invalid_request_error":
                      raise
                  # An invalid_request from the STREAM call may also concern the
                  # stream fields themselves - not only reasoning_effort.
                  # The ladder would call twice MORE with streaming and
                  # then die. The non-streaming path does not send the
                  # stream fields at all - so go there once. If the
                  # error comes back there, it goes to the ladder as usual.
                  print("relay meldete invalid_request im Strom-Aufruf "
                        "(HTTP 200) - einmal ohne Strom", file=sys.stderr)
              except _StromUnbrauchbar as e:
                  # Once without streaming. A slow review is better than
                  # none - and the REASON belongs in the log. Since
                  # the exception also covers "EOF without [DONE]" and unreadable
                  # events, "empty" would be a lie in two of three
                  # cases and the diagnosis invisible.
                  print("Strom unbrauchbar (%s) - einmal ohne" % e,
                        file=sys.stderr)
              except urllib.error.HTTPError as e:
                  # If the relay does not know `stream`, that is NOT a transient
                  # error - once without the field, then on as before. A
                  # reviewer that dies of an improvement is worse
                  # than the slow one before it.
                  if e.code != 400:
                      raise
                  print("relay kennt stream nicht - einmal ohne", file=sys.stderr)
              req = urllib.request.Request(
                  BASE + "/chat/completions",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {KEY}",
                           "Content-Type": "application/json"},
                  method="POST")
              with urllib.request.urlopen(req, timeout=300) as resp:
                  _ganz = json.load(resp)
              # HERE TOO: status 200, error in the body. Without this check
              # `out` would return an object without `choices`, and the
              # reviewer would die further down of a KeyError instead of
              # the error that is really there.
              _f = _relay_fehler(_ganz)
              if _f:
                  raise _RelayFehler(*_f)
              return _ganz

          # RETRY ON TRANSIENT ERRORS. Measured on 13 August: a
          # review failed with HTTP 502 "Upstream service temporarily
          # unavailable" - from OUR own relay. Without retries the review
          # inherits every hiccup of the platform it is meant to check, and
          # a red check without a finding teaches people to ignore red checks.
          # If it stays red, the run still fails LOUDLY.
          FLUECHTIG = {429, 500, 502, 503, 504}
          PAUSEN = [5, 20, 60]
          # WHEN WE STOP TRYING AGAIN (26 August 2026).
          # Observed on app#27: the relay reports
          #   relay meldete "Upstream HTTP/2 stream failed" (HTTP 200)
          # and each attempt hangs for about FIFTEEN minutes. Three
          # of them do not fit into the 40 min cap - it cuts
          # in the middle of the third, the run ends `cancelled` instead of red,
          # and NOTHING AT ALL remains: the same void this workflow
          # is meant to prevent. `review-push.yml` has throttled like this since 23 August;
          # since PRs became mandatory, THIS file is the main path.
          AUFRUF_GRENZE = 900
          # A STREAM THAT DIES AFTER THIS LONG IS TREATED AS A SIZE REFUSAL.
          #
          # Measured on a real run: the whole diff fitted into ONE batch, and that
          # is what killed it - "Upstream HTTP/2 stream failed" twice, about
          # fifteen minutes each, then the deadline. `_ist_zu_gross` reads WORDS,
          # and an abort carries none, because it is not a refusal. So the shrink
          # fallback built for exactly this never fired, and the transient ladder
          # sent the same oversized request again.
          #
          # The text cannot separate "the network hiccuped" from "that was too much
          # at once". The elapsed time can.
          ABRISS_IST_GROESSE = 600  # seconds
          SCHLUSS = time.monotonic() + 34 * 60

          def zeit_fuer_neuen_versuch(pause):
              """Do the pause and one whole attempt still fit before the cap?"""
              return time.monotonic() + pause + AUFRUF_GRENZE < SCHLUSS

          def wechsel_passt_noch(was):
              """A switch WITHOUT a pause still costs a whole attempt.

              Finding `mittel`: the compatibility cascade jumped with
              `continue` into a new full call - without a pause, but
              also without a deadline check. Near SCHLUSS that runs past the
              cap, and the job ends `cancelled` instead of loudly red.
              """
              if zeit_fuer_neuen_versuch(0):
                  return True
              print(f"keine Restzeit mehr fuer {was} - Schluss", file=sys.stderr)
              sys.exit(1)
          def durchsicht(user_text, system_text=system, expected_batches=None,
                         expected_paths=None):
              """Run one local batch or the final global reconciliation.
          
              The retry ladder above stays OUTSIDE on purpose. It carries
              `SCHLUSS`, the wall-clock deadline, and pulling that in here would
              restart it per batch - three batches would each get 34 minutes
              against a 40-minute cap, the job would be cancelled mid-call and
              leave nothing at all. That is exactly what happened in the frontend
              version of this change before it was caught.
              """
              payload = {"model": MODEL,
                         "messages": [{"role": "system", "content": system_text},
                                      {"role": "user", "content": user_text}],
                         "max_completion_tokens": MAX_OUT,
                         "reasoning_effort": "xhigh"}
              if SERVICE_TIER:
                  payload["service_tier"] = SERVICE_TIER
              out = None
              while out is None:
                  try:
                      _versuch_ab = time.monotonic()
                      out = call(payload)
                  except _RelayFehler as e:
                      # HTTP 200, error in the body. A rate limit is transient
                      # and belongs on the ladder - an auth or request
                      # error does not change by waiting: 85 s of pauses for
                      # the same answer three times, and only then the loud death.
                      # The TYPE decides, not the text - error texts are
                      # freely worded, and a word search in them misclassifies
                      # sooner or later. Unknown types stay
                      # on the ladder; it ends loudly after three attempts.
                      # `invalid_request_error` is NOT fatal at once: the
                      # HTTP 400 branch below has a repair
                      # (reasoning_effort max -> high -> without). If the
                      # relay reports the same case as a 200 body, the same
                      # repair applies to it - only after that is it permanent.
                      # A size refusal must be classified before that compatibility
                      # ladder. Otherwise context_length_exceeded is resent unchanged
                      # with two reasoning settings before the diff is split.
                      if _ist_zu_gross(str(e), getattr(e, "typ", "")):
                          raise _ZuGross(str(e))
                      if getattr(e, "typ", "") == "invalid_request_error":
                          _stufe = payload.get("reasoning_effort")
                          if _stufe == "max":
                              wechsel_passt_noch('high')
                              payload["reasoning_effort"] = "high"
                              print("relay meldete invalid_request (HTTP 200) - "
                                    "weiter mit reasoning_effort=high",
                                    file=sys.stderr)
                              continue
                          if payload.get("reasoning_effort") != "xhigh" and payload.pop("reasoning_effort", None) is not None:
                              wechsel_passt_noch('ohne reasoning_effort')
                              print("relay meldete invalid_request (HTTP 200) - "
                                    "weiter ohne reasoning_effort",
                                    file=sys.stderr)
                              continue
                      # No words, but it ran long: treat it as a size hint rather than
                      # retrying the same oversized batch until the deadline eats the run.
                      _gelaufen = time.monotonic() - _versuch_ab
                      if _gelaufen > ABRISS_IST_GROESSE:
                          raise _ZuGross(f"stream failed after {_gelaufen:.0f}s - "
                                         f"treating as too large: {e!s:.120}")
                      _DAUERHAFT = ("authentication_error", "invalid_api_key",
                                    "invalid_request_error", "permission_error",
                                    "not_found_error", "insufficient_quota")
                      if getattr(e, "typ", "") in _DAUERHAFT:
                          print(f"Model call failed: relay meldete {e!s} "
                                f"(typ={e.typ}, HTTP 200, service_tier={SERVICE_TIER or 'NONE'}) - dauerhaft, keine "
                                f"Wiederholung", file=sys.stderr)
                          sys.exit(1)
                      if PAUSEN and zeit_fuer_neuen_versuch(PAUSEN[0]):
                          p = PAUSEN.pop(0)
                          print(f"relay meldete \"{e}\" (HTTP 200) - neuer versuch in {p}s",
                                file=sys.stderr)
                          time.sleep(p)
                          continue
                      print(f"Model call failed: relay meldete {e!s} bei HTTP 200",
                            file=sys.stderr)
                      sys.exit(1)
                  except urllib.error.HTTPError as e:
                      # THE REASON IS IN THE BODY, NOT IN THE STATUS CODE.
                      #
                      # Relays answer an oversized request with 400 or 413 and put the actual
                      # reason in the payload. Reading only `e.code` cannot tell "too large"
                      # from "unknown field", and the two need opposite responses: resplit
                      # versus drop the field.
                      _leib = ""
                      try:
                          _leib = e.read().decode("utf-8", "replace")[:2000]
                      except Exception:
                          pass
                      if _http_ist_zu_gross(
                              e.code, _leib, getattr(e, "reason", "")):
                          raise _ZuGross(_leib or str(e))
                      # 400 is NOT a transient error: the relay does not know the field.
                      # Retry once without the field - with no wait and without using
                      # one of the three attempts.
                      if e.code == 400:
                          stufe = payload.get("reasoning_effort")
                          if stufe == "max":
                              wechsel_passt_noch('high')
                              payload["reasoning_effort"] = "high"
                              print("relay kennt reasoning_effort=max nicht - weiter mit high",
                                    file=sys.stderr)
                              continue
                          if payload.get("reasoning_effort") != "xhigh" and payload.pop("reasoning_effort", None) is not None:
                              wechsel_passt_noch('ohne reasoning_effort')
                              print("relay kennt reasoning_effort nicht - weiter ohne das feld",
                                    file=sys.stderr)
                              continue
                      if e.code in FLUECHTIG and PAUSEN and zeit_fuer_neuen_versuch(PAUSEN[0]):
                          p = PAUSEN.pop(0)
                          print(f"relay antwortete HTTP {e.code} - neuer versuch in {p}s",
                                file=sys.stderr)
                          time.sleep(p)
                          continue
                      # A reviewer that could not run must fail loudly, not pass as clean.
                      print(f"Model call failed: HTTP {e.code} (service_tier={SERVICE_TIER or 'NONE'}; "
                            f"PULLFROG_SERVICE_TIER=off omits it): {_leib[:300]!r}", file=sys.stderr)
                      sys.exit(1)
                  # ConnectionError BELONGS HERE (25 August 2026). A dropped
                  # connection raises `http.client.RemoteDisconnected`, and its
                  # inheritance is ConnectionResetError < ConnectionError < OSError -
                  # `urllib.error.URLError` is NOT in it, and neither is `TimeoutError`.
                  # So the drop went PAST this ladder, although it is
                  # built for exactly that: traceback, end, red check.
                  # Measured on eight PRs opened at the same time - seven reviews
                  # died this way; not one even tried a wait or a fallback
                  # model.
                  #
                  # This is not just a red check: the gate to `test` requires a
                  # review per commit. A drop therefore halts delivery for ALL
                  # windows until someone restarts by hand.
                  #
                  # ConnectionError and not OSError - the latter also swallows file and
                  # permission errors and retries them as if they were network errors.
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as e:
                      if PAUSEN and zeit_fuer_neuen_versuch(PAUSEN[0]):
                          p = PAUSEN.pop(0)
                          print(f"netzfehler ({getattr(e, 'reason', None) or type(e).__name__}) - neuer versuch in {p}s", file=sys.stderr)
                          time.sleep(p)
                          continue
                      print(f"Model call failed: {getattr(e, 'reason', None) or type(e).__name__}", file=sys.stderr)
                      sys.exit(1)

              text = out["choices"][0]["message"]["content"] or ""
              usage = out.get("usage", {})
              _tier = out.get("service_tier")
              OBSERVED_TIERS.append(_tier if _tier in KNOWN_TIERS else "UNVERIFIED")
              print(f"model={out.get('model')} tokens: {usage} tier requested="
                    f"{SERVICE_TIER or 'NONE'} observed={OBSERVED_TIERS[-1]}")

              if expected_batches is not None or expected_paths is not None:
                  if expected_batches is None or expected_paths is None:
                      return text.strip()[:2000], [], [], True
                  summary, findings, broken = parse_reconciliation_response(
                      text, expected_batches, expected_paths)
                  return summary, findings, [], broken

              m = re.search(r"\{.*\}", text, re.S)
              # AN UNREADABLE ANSWER IS NOT A CLEAN REVIEW.
              #
              # It used to become `{}`, then an empty finding list, and the run
              # posted its normal marker and exited green. With batches that is worse
              # than before: of N parts it is exactly the broken one that disappears
              # while the gate opens.
              parse_kaputt = False
              try:
                  verdict = json.loads(m.group(0)) if m else {}
              except ValueError:
                  verdict = {}
              if not review_envelope_is_valid(verdict):
                  verdict, parse_kaputt = {}, True
              summary = verdict.get("summary") or text.strip()[:2000]
              # A finding silently dropped is not a clean review either: a non-empty
              # list with malformed objects can pass the outer type check. Invalid
              # paths or severity labels must make the whole review incomplete rather
              # than disappearing or being encoded as zero high findings.
              _roh = verdict.get("findings") or []
              findings, invalid_findings = normalize_findings(_roh)
              parse_kaputt = parse_kaputt or invalid_findings
              if "cross_batch_facts" not in verdict:
                  parse_kaputt = True
              raw_facts = verdict.get("cross_batch_facts", [])
              if not isinstance(raw_facts, list):
                  raw_facts, parse_kaputt = [], True
              facts = [fact for fact in raw_facts
                       if isinstance(fact, str) and fact.strip()]
              if len(facts) != len(raw_facts):
                  facts, parse_kaputt = [], True
              return summary, findings, facts, parse_kaputt

          # EVERY BATCH GETS ITS OWN PASS, AND EACH CARRIES ITS OWN LIMIT.
          #
          # A refused batch is resplit at half ITS limit and pushed back to the
          # front; the batches already paid for stay done. A single global limit
          # would let a later refusal of an older, larger sibling hit the floor
          # guard and end the run - although that batch was never cut small.
          #
          # The deadline is checked from the second CALL, not the second batch:
          # after a refusal the first batch of the next pass is not the safe first
          # call of the run any more.
          # Same wording as frontend and backend: the batches are drawn fresh
          # here. Reading from `stapel` would save one pass but leave a seventh
          # variant of one loop in the tree, and the diff is already in memory.
          offen = [(MAX_DIFF, t) for t in budget_batches(diff, MAX_DIFF)]
          gesamt = len(offen)
          teil_zusammenfassungen, findings, dropped = [], [], []
          batch_reports = []
          parse_kaputt = False
          nr = 0
          erster_aufruf = True
          while offen:
              b_grenze, teile = offen.pop(0)
              nr += 1
              if not erster_aufruf and not zeit_fuer_neuen_versuch(0):
                  dropped += dropped_paths(teile)
                  continue
              erster_aufruf = False
              try:
                  s, f, facts, k = durchsicht(stapel_text(nr, gesamt, teile))
              except _ZuGross as e:
                  feiner_grenze, feiner = resplit_batch(teile, b_grenze)
                  if feiner_grenze is None:
                      print("upstream refuses an indivisible batch; no strictly "
                            "smaller retry is possible - marking it incomplete",
                            file=sys.stderr)
                      dropped += dropped_paths(teile)
                      continue
                  payload_size = sum(len(body) for _, body in teile)
                  print(f"upstream refused a {payload_size} char payload at the "
                        f"{b_grenze} char limit ({e!s:.120}) - resplitting it at "
                        f"{feiner_grenze}, {nr - 1} batch(es) done",
                        file=sys.stderr)
                  offen[0:0] = [(feiner_grenze, t) for t in feiner]
                  gesamt = nr - 1 + len(offen)
                  nr -= 1
                  continue
              parse_kaputt = parse_kaputt or k
              if s:
                  teil_zusammenfassungen.append(s if gesamt == 1 else f"({nr}/{gesamt}) {s}")
              findings += f
              batch_id = f"batch-{len(batch_reports) + 1}"
              batch_reports.append(make_batch_report(
                  batch_id, batch_paths(teile), s, facts, f))

          # Local calls cannot prove relationships that cross a batch boundary. The
          # final request is deliberately indivisible; any size, deadline, transport,
          # parse, or coverage failure keeps the review incomplete.
          reconciliation_failed = not reports_cover_manifest(manifest, batch_reports)
          if reconciliation_failed:
              print("Batch reports do not cover the complete changed-path manifest.",
                    file=sys.stderr)
          if (len(batch_reports) > 1 and not parse_kaputt and not dropped
                  and not reconciliation_failed):
              expected_batch_ids = [report["batch_id"] for report in batch_reports]
              reconciliation_prompt = reconciliation_text(manifest, batch_reports)
              if len(reconciliation_prompt) > MAX_DIFF:
                  print("Global reconciliation input exceeds the safe request budget.",
                        file=sys.stderr)
                  reconciliation_failed = True
              elif not zeit_fuer_neuen_versuch(0):
                  print("No deadline budget remains for global reconciliation.",
                        file=sys.stderr)
                  reconciliation_failed = True
              else:
                  try:
                      global_summary, global_findings, _, broken = durchsicht(
                          reconciliation_prompt,
                          system_text=reconciliation_system,
                          expected_batches=expected_batch_ids,
                          expected_paths=manifest)
                  except _ZuGross as error:
                      print(f"Global reconciliation was refused for size: {error!s:.160}",
                            file=sys.stderr)
                      reconciliation_failed = True
                  except SystemExit as error:
                      print(f"Global reconciliation call failed with exit {error.code}.",
                            file=sys.stderr)
                      reconciliation_failed = True
                  else:
                      reconciliation_failed = broken
                      if not broken:
                          if global_summary:
                              teil_zusammenfassungen.append(
                                  f"(global) {global_summary}")
                      # Individually validated global findings stay visible even
                      # when another response field or coverage receipt is invalid.
                      # The broken reconciliation still prevents a complete marker.
                      findings += body_only_findings(global_findings)
          summary = " ".join(teil_zusammenfassungen).strip() or "(no summary)"

          sev_de = {"high": "hoch", "medium": "mittel", "low": "niedrig"}
          title = "## Automated review" if english else "## Automatische Durchsicht"
          lines = [title, "", summary, ""]
          if findings:
              lines += ["| # | Datei | Zeile | Schwere | Befund |" if not english
                        else "| # | File | Line | Severity | Finding |",
                        "|---|---|---|---|---|"]
              for i, f in enumerate(findings, 1):
                  sev = f.get("severity", "medium")
                  lines.append(f"| {i} | `{f['path']}` | {f.get('line','?')} | "
                               f"{sev if english else sev_de.get(sev, sev)} | {f.get('note','')} |")
              lines.append("")
          # NAMING WHAT WAS LEFT OUT IS THE POINT.
          #
          # "truncated at 160k chars" reads like a footnote and says nothing about
          # WHAT is missing. Only the wall-clock cap can leave anything out now, and
          # the files it left are listed. Split files are deduplicated first: one
          # file across several parts would otherwise fill the twelve slots and
          # crowd out the other names.
          if dropped:
              dropped = list(dict.fromkeys(dropped))
              names = ", ".join(f"`{p}`" for p in dropped[:12])
              rest = f" (+{len(dropped)-12} more)" if len(dropped) > 12 else ""
              lines.append(
                  f"_NICHT beurteilt, weil die Zeitkappe erreicht war: {names}{rest}._"
                  if not english else
                  f"_NOT reviewed - the wall-clock cap was reached: {names}{rest}._")
          if parse_kaputt:
              lines.append(
                  "> **Die Modellantwort war kein verwertbares JSON.** Strukturierte "
                  "Befunde koennen fehlen. Der Lauf faellt deshalb durch."
                  if not english else
                  "> **The model answer was not usable JSON.** Structured findings may "
                  "be missing. The run fails for that reason.")
          if reconciliation_failed:
              lines.append(
                  "> **The mandatory global reconciliation did not complete with exact "
                  "batch and path coverage.** This review is incomplete and the run fails.")
          incomplete = parse_kaputt or bool(dropped) or reconciliation_failed
          marker = (incomplete_review_marker(head) if incomplete
                    else complete_review_marker(head))
          lines += ["", f"_{MODEL} · api.airforce · tier requested {SERVICE_TIER or 'NONE'}, "
                        f"observed {', '.join(sorted(set(OBSERVED_TIERS))) or 'UNVERIFIED'}_",
                    severity_marker(findings), marker]
          body = "\n".join(lines)

          comments = [{"path": f["path"], "line": int(f["line"]), "side": "RIGHT",
                       "body": f"**{f.get('severity','medium')}**: {f.get('note','')}"}
                      for f in findings
                      if str(f.get("line", "")).isdigit()][:20]

          def post(payload):
              r = subprocess.run(
                  ["gh", "api", "-X", "POST", f"repos/{REPO}/pulls/{PR}/reviews",
                   "--input", "-"],
                  input=json.dumps(payload), capture_output=True, text=True)
              return r.returncode == 0, r.stderr

          ok, err = post({"commit_id": head, "event": "COMMENT", "body": body,
                          "comments": comments})
          if not ok and comments:
              # A single stale line number 422s the whole review - the body-only
              # fallback keeps the findings visible instead of losing them.
              print(f"inline comments rejected ({err[:200]}), posting body only")
              ok, err = post({"commit_id": head, "event": "COMMENT", "body": body})
          if not ok:
              print(f"posting review failed: {err[:400]}", file=sys.stderr)
              sys.exit(1)
          # THERE IS NO ONE VERDICT ANY MORE - EVERY BATCH BRINGS ITS OWN.
          #
          # This line named `verdict`, which since the rework lives inside
          # `durchsicht` and does not exist out here. Left as it was it would be a
          # NameError in the very last statement: after the review was posted, so
          # with the work finished and the run red for no reason a reader could see.
          print(f"review posted: {len(findings)} finding(s) over {gesamt} batch(es)")

          # POSTED, BUT INCOMPLETE - FAIL LOUDLY INSTEAD OF LOOKING CLEAN.
          #
          # This repo had no such check at all: the run posted whatever it had and
          # ended green, whether the model answer was unreadable or whole batches
          # were never sent. A run that found nothing and a run that did not look
          # were indistinguishable from outside - which is the shape the batching
          # rework exists to remove.
          if parse_kaputt or dropped or reconciliation_failed:
              if dropped:
                  print(f"{len(dropped)} file(s) never reviewed - the wall-clock cap "
                        "was reached. Failing so an incomplete review does not read "
                        "as a clean one.", file=sys.stderr)
              if parse_kaputt:
                  print("Model answer was not parsable JSON - the review is posted "
                        "but incomplete.", file=sys.stderr)
              if reconciliation_failed:
                  print("Global reconciliation did not complete with exact coverage - "
                        "the review is posted but incomplete.", file=sys.stderr)
              sys.exit(1)
          PYEOF
