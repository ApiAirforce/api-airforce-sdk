# UEBERNOMMEN AUS api-airforce-backend (26.08.2026, backend#307).
# Fuenf von sieben Repos hatten keinen Schritt von `test` nach `main` -
# was das Tor nach `test` schob, blieb dort liegen, und niemandem fiel es
# auf, weil nichts rot wurde: es lief schlicht nichts. Die Datei ist
# repo-unabhaengig, sie braucht nur `git` und `gh`.
# Aenderungen bitte in allen sieben nachziehen.
name: promote-to-main

# Opens a release PR from `test` to `main` when a candidate lands on `test`.
#
# Why a workflow and not a token on the agent box: the built-in GITHUB_TOKEN
# lives only for the length of one run, is scoped to this repository by
# construction, and never exists outside GitHub. The Hermes agent therefore
# keeps exactly one capability — pushing with its deploy key — and gains no
# long-lived credential that could be read off the box or outlive a rotation.
#
# WHERE IT SITS IN THE CHAIN (anes' decision 2026-08-23)
#
#     dev  ->  [promote-to-test]  ->  test  ->  [this]  ->  main
#
# `test` only ever receives what the gate let through: every required check
# green, every commit reviewed, no open finding of severity `hoch`. This
# workflow is the step AFTER the functional sign-off. It reads `test`, never
# `dev` — a release that sourced `dev` would skip the middle stage and ship a
# tree nobody looked at.
#
# WHY IT DOES NOT MERGE BY ITSELF
#   A merge releases EVERYONE's pending work, not the commit that triggered it.
#   Deciding that is a release decision, so this workflow prepares it — PR
#   opened, full change list visible — and a human presses merge after the
#   functional sign-off on `test`. Auto-merge is available for the day that
#   sign-off becomes mechanical: set AUTO_MERGE below to "true".
#
# The old opt-in marker [promote-to-main] on a dev commit is GONE. The gate now
# decides what reaches `test`; a marker on `dev` would route around it.

on:
  # A candidate arriving on `test` prepares the PR. It does NOT merge it — the
  # functional sign-off happens on `test` first, and a human presses merge.
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  AUTO_MERGE: "false"

# SUCHEN UND ANLEGEN SIND NICHT ATOMAR (Befund `mittel`, 26.08.2026).
# Ohne diese Gruppe koennen zwei rasche Pushes beide keinen PR finden -
# einer scheitert dann am inzwischen angelegten, oder ein aelterer Lauf
# schreibt zuletzt einen veralteten Rumpf. NICHT `cancel-in-progress`:
# der spaetere Stand soll gewinnen, aber nacheinander, nicht verschraenkt.
concurrency:
  group: promote-to-main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  open-release-pr:
    # `ubuntu-latest`, NOT the org's own runner - this repository is public.
    #
    # The move to `[self-hosted, airforce-heavy]` on 19.08.2026 was right for
    # the six private repositories, where `ubuntu-latest` jobs no longer get a
    # runner assigned. It was carried into this file as well, and here it is
    # wrong twice over:
    #
    #   - There is no runner to get. `airforce-heavy` is registered on the
    #     private repositories; a public repository is not offered them.
    #     Measured 28.08.2026: this job sat `queued` for 30 minutes with an
    #     otherwise idle queue, while every other workflow in this repository
    #     ran on `ubuntu-latest` in the same minutes. It would have waited
    #     forever - the release of four commits simply never started.
    #   - It contradicts this repository's own rule. `promote-to-test.yml`
    #     states it in the file: a self-hosted runner on a public repository
    #     is attackable through a fork pull request, so this repository uses
    #     hosted runners on purpose.
    #
    # The failure hides well, which is why it went unnoticed for nine days:
    # the workflow reports `skipped` while no commit carries the marker, so it
    # looks healthy, and that it can no longer START only shows on the day
    # someone triggers a release. The job needs nothing but `git` and `gh`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: How far apart are test and main?
        id: gap
        run: |
          git fetch origin main test
          AHEAD=$(git rev-list --count origin/main..origin/test)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "test ist $AHEAD commit(s) vor main"
          if [ "$AHEAD" -eq 0 ]; then
            echo "nichts zu promoten"; exit 0
          fi
          # The change list goes into the PR body: whoever merges must be able to
          # see, without digging, that this releases other people's work too.
          # KEIN STILLER DECKEL (Befund `mittel`). Der Rumpf ist die
          # Entscheidungsgrundlage fuer den Merge - eine Liste, die
          # verschweigt, dass sie unvollstaendig ist, laedt dazu ein,
          # etwas auszuliefern, das niemand gesehen hat. Deshalb 200
          # statt 60, und was dann noch fehlt, wird BENANNT.
          git log --no-merges --format='- `%h` %s — %an' \
              origin/main..origin/test > /tmp/alle.txt
          GESAMT=$(wc -l < /tmp/alle.txt)
          {
            echo "## Was mit nach main ginge ($AHEAD commit(s))"
            echo
            head -200 /tmp/alle.txt
            if [ "$GESAMT" -gt 200 ]; then
              echo
              echo "> **Und $(( GESAMT - 200 )) weitere Commits, hier nicht aufgefuehrt.**"
              echo "> Vollstaendig unter *Files changed* bzw. mit"
              echo "> \`git log --no-merges origin/main..origin/test\`."
            fi
            echo
            echo "### Wer daran beteiligt ist"
            git log --no-merges --format='%an' origin/main..origin/test \
                > /tmp/autoren.txt
            sort /tmp/autoren.txt | uniq -c | sort -rn
          } > /tmp/body.md

      - name: Open or update the release PR
        if: steps.gap.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # `--head test` FILTERT NUR DEN ZWEIGNAMEN (Befund `hoch`).
          # Ein Fork kann einen PR mit Kopf `test` offen haben; ohne
          # `isCrossRepository == false` wuerde der Bot dessen Rumpf
          # ueberschreiben und ihn als Release-PR behandeln. Dieselbe
          # Luecke wie am 25.08. in sync-main-to-dev.
          # DER EIGENTUEMER GEHOERT IN DEN FILTER, NICHT ERST IN JQ
          # (Befund `mittel`, 26.08.2026). `gh pr list` liefert ohne
          # `--limit` hoechstens 30 Treffer, und der Fork-Ausschluss lief
          # erst danach - dreissig neuere Fork-PRs mit Kopf `test` haetten
          # den echten Release-PR aus der Menge gedraengt. `EXISTING`
          # waere leer geblieben und `gh pr create` am bereits
          # vorhandenen internen PR gescheitert.
          # `owner:zweig` schraenkt serverseitig ein; `isCrossRepository`
          # bleibt als zweiter Riegel stehen.
          # UEBER DIE API, NICHT UEBER `gh pr list` (nachgemessen
          # 26.08.2026). `gh pr list --head` nimmt NUR den blossen
          # Zweignamen - `--head owner:zweig` liefert dort LEER. Belegt an
          # einem PR, von dem wir wussten, dass es ihn gibt:
          #   gh pr list --head ci/45-pfadfilter             -> 46
          #   gh pr list --head ApiAirforce:ci/45-pfadfilter -> (leer)
          #   gh api ...pulls?head=ApiAirforce:ci/45-...     -> 46
          # Ohne den Eigentuemer im Filter greift der Fork-Ausschluss aber
          # erst nach der Seitengrenze - dreissig neuere Fork-PRs mit Kopf
          # `test` haetten den echten Release-PR verdraengt.
          # Die rohe API kann `head=owner:zweig` serverseitig. Der
          # Vergleich auf das volle Repo bleibt als zweiter Riegel; jq
          # liest die Umgebung ueber `env`, weil `gh api --jq` kein
          # `--arg` kennt.
          EXISTING=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=$GITHUB_REPOSITORY_OWNER:test&per_page=100" \
            --jq '[.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY)][0].number // empty')
          TITEL="release: test -> main (${{ steps.gap.outputs.ahead }} commits)"
          if [ -n "$EXISTING" ]; then
            # Auch den TITEL mitziehen (Befund `niedrig`): sonst traegt er
            # ewig die Zahl vom Anlegen und wirbt mit einer falschen
            # Release-Groesse.
            gh pr edit "$EXISTING" --title "$TITEL" --body-file /tmp/body.md
            echo "PR #$EXISTING aktualisiert"
            echo "PR=$EXISTING" >> "$GITHUB_ENV"
          else
            URL=$(gh pr create --base main --head test \
                  --title "$TITEL" \
                  --body-file /tmp/body.md)
            echo "PR angelegt: $URL"
            echo "PR=${URL##*/}" >> "$GITHUB_ENV"
          fi

      - name: Merge (only when explicitly enabled)
        if: steps.gap.outputs.ahead != '0' && env.AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "$PR" --merge

      - name: Say what still needs a human
        if: steps.gap.outputs.ahead != '0' && env.AUTO_MERGE != 'true'
        run: |
          echo "::notice::PR #$PR ist offen. Der Stand hat das Tor zwischen dev und test passiert."
          echo "::notice::Der Merge bleibt bewusst manuell: er wuerde ${{ steps.gap.outputs.ahead }} commit(s) mehrerer Agenten nach main bringen -- und das Tor prueft Pruefungen und Durchsicht, nicht die Funktion."
