# Haelt dev auf dem Stand von main — automatisch, nach jedem Push auf main.
#
# WARUM ES DAS GIBT (gemessen am 17.08.2026): dev hing 3 Commits HINTER main.
# Nicht aus Nachlaessigkeit, sondern mechanisch — auf main schreiben Quellen,
# die dev nie sieht:
#   - Releases und CI-Korrekturen werden direkt auf main gemacht
# Entwickelt wird auf dev. Zurueck gemerged hat es nie jemand, also baute jeder
# neue Zweig auf einem dev auf, das den laufenden prod-Stand nicht kannte.
#
# Diese Richtung (main -> dev) ist die ungefaehrliche: dev deployt nur die
# dev-Umgebung. Die Gegenrichtung (dev -> main) ist ein Produktions-Release
# und bleibt bewusst Handarbeit — sie wird hier NICHT automatisiert.
#
# Bei einem Konflikt wird NICHT still abgebrochen: der Job legt einen PR an,
# damit die Divergenz sichtbar bleibt statt wieder anzuwachsen.

name: sync main to dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Identitaet fuer den Merge-Commit
        run: |
          git config user.name  "airforce-sync-bot"
          git config user.email "sync-bot@api.airforce"

      - name: main nach dev mergen
        id: merge
        env:
          # NEU (25.08.2026): der Schritt oeffnet jetzt selbst einen PR und
          # braucht dafuer eine Anmeldung. Ohne diese Zeile bricht `gh` mit
          # "To use GitHub CLI ... set the GH_TOKEN environment variable" ab.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git fetch origin main dev
          AHEAD=$(git rev-list --count origin/dev..origin/main)
          echo "main ist $AHEAD Commits vor dev"
          if [ "$AHEAD" -eq 0 ]; then
            echo "nichts zu tun"
            echo "status=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit origin/main -m "chore: sync dev with main ($AHEAD commits)"; then
            # KEIN DIREKT-PUSH AUF `dev` MEHR. `dev` nimmt seit dem 25.08.2026
            # nur noch gemergte PRs an; ein Push von hier wuerde mit GH013
            # abgewiesen und dieser Abgleich liefe stuendlich rot. Genau hier
            # waere der Ausfall am teuersten - dies ist die einzige Stelle, die
            # `dev` und `main` zusammenhaelt.
            #
            # Derselbe Inhalt, nur ueber einen PR, der sofort gemergt wird. Der
            # PR ist kein Tor, sondern die Spur: man sieht hinterher, was der
            # Abgleich mitgenommen hat. Beim Direkt-Push stand dort nur ein
            # Commit von einem Bot.
            #
            # EIGENER ZWEIG, nicht der des Konflikt-PRs weiter unten: laege
            # dort gerade eine Aufloesung von Hand, wuerde ein Force-Push sie
            # unter der laufenden Arbeit wegziehen.
            AUTO_ZWEIG=sync/auto-main-to-dev
            ZIEL_SHA=$(git rev-parse HEAD)
            git push -f origin "HEAD:refs/heads/$AUTO_ZWEIG"
            # NUR EIN PR AUS DIESEM REPO UND MIT GENAU DIESEM COMMIT. Befund `hoch`
            # der Durchsicht, 25.08.2026, in drei Repos gleichzeitig gemeldet:
            # `gh pr list --head <name>` filtert nur den NAMEN des Head-Refs, nicht
            # dessen Quell-Repository. Ein Fork kann einen offenen PR nach `dev` mit
            # demselben Zweignamen anlegen - dann waere die Nummer schon gesetzt, der
            # eigene PR wuerde uebersprungen, und der privilegierte Merge unten holte
            # fremden Inhalt herein.
            # Dazu: der feste Zweig ist force-pushbar. Zwischen unserem Push und dem
            # Merge kann ihn jeder Schreibberechtigte verschieben.
            # Deshalb beides - `isCrossRepository == false` und der Abgleich gegen
            # unseren eigenen Kopf. `--match-head-commit` weiter unten ist der
            # staerkere Riegel: der hier prueft eine Momentaufnahme, jener laesst
            # GitHub im Moment des Merges selbst pruefen.
            NR=$(gh pr list --base dev --head "$AUTO_ZWEIG" --state open \
                   --json number,isCrossRepository,headRefOid \
                   --jq ".[] | select(.isCrossRepository == false and .headRefOid == \"$ZIEL_SHA\") | .number" \
                 | head -1)
            if [ -z "$NR" ]; then
              # Die Nummer NICHT aus der Ausgabe von `pr create` schneiden - wer
              # aus der URL alle Ziffern zieht, klebt die aus dem Repo-Namen mit
              # an. Anlegen, dann sauber nachfragen.
              gh pr create --base dev --head "$AUTO_ZWEIG" \
                --title "chore: dev mit main abgleichen ($AHEAD Commits)" \
                --body "Automatischer Abgleich von main nach dev, $AHEAD Commit(s). Wird sofort gemergt - der PR ist die Spur, kein Tor."
              NR=$(gh pr list --base dev --head "$AUTO_ZWEIG" --state open \
                     --json number,isCrossRepository,headRefOid \
                     --jq ".[] | select(.isCrossRepository == false and .headRefOid == \"$ZIEL_SHA\") | .number" \
                   | head -1)
            fi
            if [ -z "$NR" ]; then
              echo "::error::PR fuer $AUTO_ZWEIG liess sich weder finden noch anlegen."
              exit 1
            fi
            # Schlaegt der Merge fehl, ist das ein echter Fehler und der Lauf
            # soll rot werden - dieser Abgleich darf nicht still ausfallen.
            # DAS ZIEL BINDEN, NICHT NUR DEN KOPF. Befund `hoch` der Durchsicht,
            # 25.08.2026: `--match-head-commit` prueft den Kopf des PRs. Ein
            # Schreibberechtigter kann den ueber `--base dev` gefundenen PR
            # zwischen Abfrage und Merge auf `main` umhaengen - der Kopf bleibt
            # derselbe, der Merge geht durch, und dieser Ablauf meldete
            # `status=merged`, obwohl `dev` unveraendert ist.
            BASIS=$(gh pr view "$NR" --json baseRefName --jq .baseRefName)
            if [ "$BASIS" != "dev" ]; then
              echo "::error::PR #$NR zielt auf '$BASIS', nicht auf dev. Kein Merge."
              exit 1
            fi
            gh pr merge "$NR" --merge --delete-branch --match-head-commit "$ZIEL_SHA"
            # UND DANACH DAS ERGEBNIS MESSEN. Jede Vorab-Pruefung ist nur eine
            # Momentaufnahme; zwischen ihr und dem Merge bleibt eine Luecke. Das
            # hier vertraut dem Aufruf nicht, sondern sieht nach - und faengt
            # damit auch Faelle, die niemand vorher aufgezaehlt hat.
            git fetch origin dev
            if ! git merge-base --is-ancestor "$ZIEL_SHA" origin/dev; then
              echo "::error::Merge gemeldet, aber $ZIEL_SHA liegt nicht auf dev."
              exit 1
            fi
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Bei Konflikt einen PR oeffnen, statt still zu scheitern
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ein bestehender offener PR reicht — sonst entsteht bei jedem
          # main-Push ein weiterer und niemand sieht mehr, was offen ist.
          # NIEMALS `main` selbst als Head. GitHubs "Resolve conflicts" und
          # "Update branch" schreiben die Aufloesung auf den HEAD-Zweig und
          # mergen dafuer die Base (`dev`) hinein. Mit `head=main` hiesse das:
          # unfreigegebener `dev`-Stand landet auf `main` - genau der Weg, den
          # die Kette dev -> test -> main ausschliesst. Und weil `main` per
          # Ruleset geschuetzt ist, scheitert die Aufloesung stattdessen: der
          # PR ist ueber die Oberflaeche gar nicht zu bearbeiten. Beides als
          # Befund `hoch` gemeldet, 23.08.2026, in vier Repos gleichzeitig.
          SYNC_ZWEIG=sync/main-to-dev
          VORHANDEN=$(gh pr list --base dev --head "$SYNC_ZWEIG" --state open --json number --jq 'length')
          if [ "$VORHANDEN" -gt 0 ]; then
            echo "PR existiert bereits, kein zweiter"
            exit 0
          fi
          # Erst hier setzen: laege schon ein PR offen, wuerde ein Neusetzen
          # den Zweig unter einer laufenden Aufloesung wegziehen.
          git push -f origin "origin/main:refs/heads/$SYNC_ZWEIG"
          # Body ueber eine Datei, nicht inline: ein mehrzeiliger --body-String
          # sprengt den YAML-Block, und Backticks darin wuerden von der Shell
          # als Kommando-Substitution ausgefuehrt.
          cat > /tmp/pr-body.md <<'ENDE'
          Der automatische Abgleich main -> dev ist an einem Konflikt gescheitert.

          Solange dieser PR offen ist, baut jeder neue Zweig aus dev auf einem
          Stand auf, der die Arbeit auf main nicht kennt — darunter die
          taeglichen Bot-Commits und alles, was per Release direkt auf main ging.

          Bitte von Hand aufloesen und mergen. Der Job laeuft danach wieder von
          selbst.
          ENDE
          gh pr create --base dev --head "$SYNC_ZWEIG" \
            --title "dev hinkt main hinterher — Merge braucht Handarbeit" \
            --body-file /tmp/pr-body.md
