# Keeps dev level with main — automatically, after every push to main.
#
# WHY THIS EXISTS (measured 2026-08-17): dev was 3 commits BEHIND main.
# Not out of sloppiness but mechanically — main is written by sources dev
# never sees:
#   - releases and CI fixes are made directly on main
# Development happens on dev. Nobody ever merged back, so every new branch was
# built on a dev that did not know the running prod state.
#
# This direction (main -> dev) is the harmless one: dev only deploys the dev
# environment. The opposite direction (dev -> main) is a production release and
# stays deliberately manual — it is NOT automated here.
#
# On a conflict this does NOT fail silently: the job opens a PR so the
# divergence stays visible instead of growing back.

name: sync main to dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Identity for the merge commit
        run: |
          git config user.name  "airforce-sync-bot"
          git config user.email "sync-bot@api.airforce"

      - name: Merge main into dev
        id: merge
        env:
          # NEW (2026-08-25): this step now opens a PR itself and needs
          # credentials for that. Without this line `gh` aborts with
          # "To use GitHub CLI ... set the GH_TOKEN environment variable".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git fetch origin main dev
          AHEAD=$(git rev-list --count origin/dev..origin/main)
          echo "main is $AHEAD commits ahead of dev"
          if [ "$AHEAD" -eq 0 ]; then
            echo "nothing to do"
            echo "status=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit origin/main -m "chore: sync dev with main ($AHEAD commits)"; then
            # NO MORE DIRECT PUSH TO `dev`. Since 2026-08-25 `dev` only accepts
            # merged PRs; a push from here would be rejected with GH013 and
            # this sync would run red every hour. This is exactly where the
            # outage would be most expensive - it is the only thing holding
            # `dev` and `main` together.
            #
            # Same content, just through a PR that is merged immediately. The
            # PR is not a gate, it is the trail: afterwards you can see what
            # the sync carried along. A direct push left nothing there but a
            # commit from a bot.
            #
            # ITS OWN BRANCH, not the one of the conflict PR below: if a
            # resolution were being written there by hand, a force push would
            # pull it out from under the work in progress.
            AUTO_BRANCH=sync/auto-main-to-dev
            TARGET_SHA=$(git rev-parse HEAD)
            git push -f origin "HEAD:refs/heads/$AUTO_BRANCH"
            # ONLY A PR FROM THIS REPO AND WITH EXACTLY THIS COMMIT. Finding of
            # severity `hoch` from the review, 2026-08-25, reported in three repos
            # at once: `gh pr list --head <name>` filters only the NAME of the head
            # ref, not its source repository. A fork can open a PR to `dev` with the
            # same branch name - the number would already be set, our own PR would
            # be skipped, and the privileged merge below would pull in foreign
            # content.
            # On top of that: the fixed branch is force-pushable. Between our push
            # and the merge anyone with write access can move it.
            # Hence both - `isCrossRepository == false` and the comparison against
            # our own head. `--match-head-commit` further down is the stronger
            # bolt: this one checks a snapshot, that one has GitHub check at the
            # moment of the merge itself.
            NR=$(gh pr list --base dev --head "$AUTO_BRANCH" --state open \
                   --json number,isCrossRepository,headRefOid \
                   --jq ".[] | select(.isCrossRepository == false and .headRefOid == \"$TARGET_SHA\") | .number" \
                 | head -1)
            if [ -z "$NR" ]; then
              # Do NOT cut the number out of the output of `pr create` - pulling
              # every digit from the URL glues on the ones from the repo name as
              # well. Create it, then ask cleanly.
              gh pr create --base dev --head "$AUTO_BRANCH" \
                --title "chore: sync dev with main ($AHEAD commits)" \
                --body "Automatic sync from main to dev, $AHEAD commit(s). Merged immediately - the PR is the trail, not a gate."
              NR=$(gh pr list --base dev --head "$AUTO_BRANCH" --state open \
                     --json number,isCrossRepository,headRefOid \
                     --jq ".[] | select(.isCrossRepository == false and .headRefOid == \"$TARGET_SHA\") | .number" \
                   | head -1)
            fi
            if [ -z "$NR" ]; then
              echo "::error::Could neither find nor create a PR for $AUTO_BRANCH."
              exit 1
            fi
            # If the merge fails that is a real error and the run should go red -
            # this sync must not fail silently.
            # BIND THE TARGET, NOT JUST THE HEAD. Finding of severity `hoch` from
            # the review, 2026-08-25: `--match-head-commit` checks the head of the
            # PR. Someone with write access can re-target the PR found via
            # `--base dev` to `main` between the query and the merge - the head
            # stays the same, the merge goes through, and this workflow reported
            # `status=merged` while `dev` is unchanged.
            BASE=$(gh pr view "$NR" --json baseRefName --jq .baseRefName)
            if [ "$BASE" != "dev" ]; then
              echo "::error::PR #$NR targets '$BASE', not dev. No merge."
              exit 1
            fi
            gh pr merge "$NR" --merge --delete-branch --match-head-commit "$TARGET_SHA"
            # AND THEN MEASURE THE RESULT. Every up-front check is only a
            # snapshot; a gap remains between it and the merge. This does not
            # trust the call, it looks - and so it also catches cases nobody
            # enumerated beforehand.
            git fetch origin dev
            if ! git merge-base --is-ancestor "$TARGET_SHA" origin/dev; then
              echo "::error::Merge reported, but $TARGET_SHA is not on dev."
              exit 1
            fi
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: On conflict open a PR instead of failing silently
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One existing open PR is enough — otherwise every push to main
          # creates another and nobody can see what is open any more.
          # NEVER `main` itself as the head. GitHub's "Resolve conflicts" and
          # "Update branch" write the resolution onto the HEAD branch and merge
          # the base (`dev`) into it for that. With `head=main` that would
          # mean: unreleased `dev` state lands on `main` - exactly the path the
          # chain dev -> test -> main rules out. And because `main` is
          # protected by a ruleset, the resolution fails instead: the PR cannot
          # be edited through the web UI at all. Both reported as findings of
          # severity `hoch`, 2026-08-23, in four repos at once.
          SYNC_BRANCH=sync/main-to-dev
          EXISTING=$(gh pr list --base dev --head "$SYNC_BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "a PR already exists, not opening a second one"
            exit 0
          fi
          # Only set it here: if a PR were already open, resetting the branch
          # would pull it out from under a resolution in progress.
          git push -f origin "origin/main:refs/heads/$SYNC_BRANCH"
          # Body through a file, not inline: a multi-line --body string breaks
          # the YAML block, and backticks inside it would be executed by the
          # shell as command substitution.
          cat > /tmp/pr-body.md <<'END'
          The automatic sync main -> dev failed on a conflict.

          As long as this PR is open, every new branch off dev builds on a state
          that does not know the work on main — including the daily bot commits
          and everything that went straight to main via a release.

          Please resolve and merge by hand. The job runs by itself again
          afterwards.
          END
          gh pr create --base dev --head "$SYNC_BRANCH" \
            --title "dev is behind main — the merge needs a human" \
            --body-file /tmp/pr-body.md
